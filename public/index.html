<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta name="google" content="notranslate" />
<title>Talkie</title>
<style>
  * { box-sizing: border-box; }
  html {
    /* Android系ブラウザの自動ダーク変換を止め、背景色も明示する */
    color-scheme: dark;
    background: #12141c;
  }
  [data-theme="light"] { color-scheme: light; background: #f3f2ee; }
  [data-theme="dark"] { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #12141c;
    color: #e7e6e2;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #181b25;
    border: 1px solid #2a2e3a;
    border-radius: 16px;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 16px; text-align: center; }
  label { font-size: 12px; color: #8a8f9e; display: block; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #33384a;
    background: #0f111a;
    color: #fff;
    margin-bottom: 12px;
    font-size: 14px;
  }
  input.code { font-family: monospace; letter-spacing: 0.2em; }
  select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #33384a;
    background: #0f111a; color: #fff; margin-bottom: 12px; font-size: 14px;
  }
  [data-theme="light"] select { background: #f7f6f2; color: #1d1f27; border-color: #d4d2c8; }
  .hint { font-size: 11px; color: #5f6473; margin: -8px 0 12px; }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: #e0a840;
    color: #1a1206;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    font-size: 14px;
  }
  button.secondary { background: #20242f; color: #c7cad3; border: 1px solid #33384a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 13px; color: #e0a840; margin: 8px 0 16px; text-align: center; }
  .error { font-size: 12px; color: #ff6b6b; margin: 4px 0 12px; }
  .code-badge {
    font-family: monospace;
    letter-spacing: 0.3em;
    font-size: 20px;
    text-align: center;
    background: #0f111a;
    border: 1px solid #33384a;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .chat-box {
    height: 260px;
    overflow-y: auto;
    background: #0f111a;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; margin-bottom: 0; }
  .row button { width: auto; padding: 10px 16px; margin-bottom: 0; }
  .hidden { display: none; }
  /* --- モード選択画面 --- */
  .mode-card {
    width: 100%; text-align: left; padding: 14px; border-radius: 14px;
    background: #20242f; border: 1px solid #33384a; color: inherit;
    cursor: pointer; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .mode-card .mc-icon { font-size: 22px; line-height: 1.2; }
  .mode-card .mc-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .mode-card .mc-desc { font-size: 12px; color: #8a8f9e; }
  .back-link {
    width: auto; margin: 0 0 14px; padding: 6px 12px; background: none; color: inherit;
    font-size: 12px; border: 1px solid #33384a; border-radius: 8px;
  }
  .member-list { font-size: 12px; color: #8a8f9e; margin: -6px 0 10px; word-break: break-all; }
  /* --- 個人チャットのヘッダー --- */
  .chat-header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #2a2e3a; }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header-sub { font-size: 11px; color: #8a8f9e; }
  .icon-btn {
    width: 36px; height: 36px; flex: none; margin: 0; padding: 0;
    border-radius: 50%; background: #20242f; border: 1px solid #33384a; color: inherit; font-size: 16px;
  }
  .mute-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .mute-row button { margin-bottom: 0; font-size: 12px; padding: 8px 6px; }
  .chat-box-tall { height: 320px; }
  .system-msg { text-align: center; font-size: 11px; color: #8a8f9e; margin: 4px 0 12px; }
  /* --- メッセージ(フラット表示: アイコン + 名前/時刻 + 本文) --- */
  .msg-flat {
    display: flex; gap: 10px; padding: 6px 4px; border-radius: 10px; position: relative;
    /* 長押しで、独自メニューより先にブラウザ標準の選択/コピー吹き出しが出るのを防ぐ */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .avatar-circle {
    width: 34px; height: 34px; border-radius: 50%; flex: none; margin-top: 1px;
    background: #33384a; color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg-body { flex: 1; min-width: 0; }
  .msg-head { display: flex; align-items: baseline; gap: 7px; }
  .msg-name { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-time { font-size: 10.5px; color: #5f6473; flex: none; }
  .msg-text { font-size: 14px; line-height: 1.5; margin-top: 2px; word-break: break-word; white-space: pre-wrap; }
  .msg-flat.mine .msg-name { color: var(--my-name-color, #e0a840); }
  .msg-flat.mine .msg-text { color: var(--my-msg-color, inherit); }
  .mention { color: #e0a840; font-weight: 700; }
  .msg-flat.mention-me { background: rgba(224,168,64,.12); }
  .read-receipt { font-size: 10.5px; color: #5f6473; margin-top: 3px; text-align: right; }
  /* --- リアクション --- */
  .reaction-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .reaction-pill {
    width: auto; margin: 0; padding: 2px 9px; font-size: 12.5px; border-radius: 999px;
    background: #20242f; border: 1px solid #33384a; color: inherit; display: inline-flex; align-items: center; gap: 4px;
  }
  .reaction-pill.mine { border-color: #e0a840; background: rgba(224,168,64,.18); }
  [data-theme="light"] .reaction-pill { background: #efeee8; border-color: #d4d2c8; }
  [data-theme="light"] .reaction-pill.mine { border-color: #e0a840; background: rgba(224,168,64,.18); }
  /* --- メッセージ長押しの操作シート(下から出るメニュー) --- */
  .quick-emoji-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 4px 16px; }
  .quick-emoji-row button {
    width: 46px; height: 46px; font-size: 22px; border-radius: 50%; flex: none;
    background: #20242f; border: 1px solid #33384a; color: inherit; margin: 0; padding: 0;
  }
  .quick-emoji-row button:active { background: #2a2e3a; }
  [data-theme="light"] .quick-emoji-row button { background: #efeee8; border-color: #d4d2c8; }
  .sheet-action {
    width: 100%; text-align: left; margin: 0; padding: 14px 6px; font-size: 14px;
    background: none; border: none; border-bottom: 1px solid #2a2e3a; color: inherit; border-radius: 0;
  }
  .sheet-action:last-child { border-bottom: none; }
  .sheet-action.danger { color: #ff6b6b; }
  [data-theme="light"] .sheet-action { border-color: #dcdad2; }
  .reactor-row { padding: 8px 4px; font-size: 14px; border-bottom: 1px solid #2a2e3a; }
  .reactor-row:last-child { border-bottom: none; }
  [data-theme="light"] .reactor-row { border-color: #dcdad2; }
  .sheet-title { font-size: 20px; font-weight: 700; text-align: center; margin: 0 0 10px; }
  /* --- 編集中の入力欄 --- */
  .edit-box textarea {
    width: 100%; min-height: 60px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid #33384a; background: #0f111a; color: #fff; font-size: 14px;
    font-family: inherit; margin-bottom: 6px; resize: vertical;
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions button { width: auto; margin: 0; padding: 6px 14px; font-size: 12px; }
  .edited-tag { font-size: 10.5px; color: #5f6473; margin-left: 4px; }
  /* --- 返信の引用表示(アイコン+名前+抜粋のカード、下の本文へ繋がる線付き)・返信プレビュー --- */
  .reply-quote {
    display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 10px; margin: 0 0 5px 10px;
    font-size: 12px; color: #8a8f9e; background: rgba(255,255,255,.04); border-radius: 8px;
    cursor: pointer; max-width: calc(100% - 10px); position: relative;
  }
  .reply-quote::before {
    content: ""; position: absolute; left: -10px; top: -8px; bottom: 50%; width: 10px;
    border-left: 2px solid #33384a; border-bottom: 2px solid #33384a; border-radius: 0 0 0 8px;
  }
  .reply-quote .rq-avatar {
    width: 16px; height: 16px; border-radius: 50%; flex: none; overflow: hidden;
    background: #33384a; color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .reply-quote .rq-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reply-quote .rq-name { font-weight: 700; color: #c7cad3; flex: none; }
  .reply-quote .rq-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-theme="light"] .reply-quote { color: #6b6f7c; background: rgba(0,0,0,.03); }
  [data-theme="light"] .reply-quote::before { border-color: #d4d2c8; }
  [data-theme="light"] .reply-quote .rq-name { color: #3a3d48; }
  .reply-preview {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 8px;
    background: #20242f; border: 1px solid #33384a; border-radius: 10px; font-size: 12px;
  }
  .reply-preview .rp-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c7cad3; }
  .reply-preview button { width: auto; margin: 0; padding: 2px 8px; background: none; color: inherit; font-size: 14px; }
  [data-theme="light"] .reply-preview { background: #efeee8; border-color: #d4d2c8; }
  [data-theme="light"] .reply-preview .rp-text { color: #3a3d48; }
  /* --- オープンチャット: タグ選択・部屋一覧 --- */
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag-chip {
    width: auto; margin: 0; padding: 6px 14px; font-size: 12.5px; border-radius: 999px;
    background: #20242f; border: 1px solid #33384a; color: #c7cad3;
  }
  .tag-chip.on { background: #e0a840; color: #1a1206; border-color: #e0a840; }
  [data-theme="light"] .tag-chip { background: #efeee8; border-color: #d4d2c8; color: #3a3d48; }
  .open-room-card {
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px;
    background: #20242f; border: 1px solid #33384a; color: inherit; cursor: pointer; margin-bottom: 10px;
  }
  .open-room-card .or-title { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 6px; }
  .open-room-card .or-meta { font-size: 11.5px; color: #8a8f9e; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .open-room-card .or-tag {
    padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 11px;
  }
  [data-theme="light"] .open-room-card { background: #fff; border-color: #dcdad2; }
  [data-theme="light"] .open-room-card .or-meta { color: #6b6f7c; }
  [data-theme="light"] .open-room-card .or-tag { background: rgba(0,0,0,.05); }
  /* --- 入力中インジケーター --- */
  .typing-indicator { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8a8f9e; margin: -2px 0 6px; }
  .typing-indicator.hidden { display: none; }
  .typing-indicator .dots span { font-size: 8px; }
  [data-theme="light"] .typing-indicator { color: #6b6f7c; }
  /* --- 送信欄 --- */
  .mention-list { display: flex; flex-direction: column; gap: 4px; margin: -4px 0 8px; }
  .mention-list button {
    width: auto; text-align: left; margin: 0; padding: 6px 10px; font-size: 13px;
    background: #20242f; border: 1px solid #33384a; color: inherit; border-radius: 8px;
  }
  [data-theme="light"] .mention-list button { background: #efeee8; border-color: #d4d2c8; color: #3a3d48; }
  .composer { display: flex; align-items: center; gap: 8px; }
  .composer input { flex: 1; margin-bottom: 0; border-radius: 999px; padding: 10px 16px; }
  .send-btn { width: 42px; height: 42px; flex: none; margin: 0; padding: 0; border-radius: 50%; font-size: 16px; }
  [data-theme="light"] .icon-btn { background: #efeee8; color: #3a3d48; border-color: #d4d2c8; }
  [data-theme="light"] .chat-header { border-color: #dcdad2; }
  [data-theme="light"] .chat-header-sub, [data-theme="light"] .system-msg { color: #6b6f7c; }
  [data-theme="light"] .avatar-circle { background: #d4d2c8; color: #3a3d48; }
  /* --- 待機中の演出 --- */
  .spinner {
    width: 44px; height: 44px; margin: 4px auto 16px;
    border: 4px solid #33384a; border-top-color: #e0a840;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots span { animation: dotFade 1.4s infinite; opacity: 0; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotFade { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
  [data-theme="light"] .spinner { border-color: #d4d2c8; border-top-color: #e0a840; }
  /* --- 設定パネル --- */
  .gear { position: fixed; top: 12px; right: 12px; width: auto; margin: 0; padding: 8px 10px; background: #20242f; border: 1px solid #33384a; font-size: 16px; z-index: 5; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.hidden { display: none; }
  .sheet { width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; background: #181b25; border: 1px solid #2a2e3a; border-radius: 16px 16px 0 0; padding: 16px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .x { width: auto; margin: 0; padding: 4px 10px; background: none; color: inherit; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tab { flex: 1; margin: 0; padding: 8px 4px; font-size: 12px; background: #20242f; color: #c7cad3; border: 1px solid #33384a; }
  .tab.on { background: #e0a840; color: #1a1206; border-color: #e0a840; }
  .sheet select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #33384a; background: #0f111a; color: #fff; }
  .sheet input[type=range] { padding: 0; border: 0; background: none; }
  .sheet input[type=checkbox], .sheet input[type=radio] { width: auto; margin: 0 8px 0 0; }
  .sw { display: flex; align-items: center; font-size: 14px; color: inherit; margin-bottom: 12px; }
  .meter { height: 10px; background: #0f111a; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .meter i { display: block; height: 100%; width: 0; background: #e0a840; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; margin-bottom: 8px; }
  .sw input[type=checkbox] { width: auto; margin: 0 8px 0 0; padding: 0; }
  /* --- ライトテーマ --- */
  [data-theme="light"] body { background: #f3f2ee; color: #1d1f27; }
  [data-theme="light"] .card, [data-theme="light"] .sheet { background: #fff; border-color: #dcdad2; }
  [data-theme="light"] input, [data-theme="light"] .sheet select, [data-theme="light"] .code-badge, [data-theme="light"] .chat-box, [data-theme="light"] .meter { background: #f7f6f2; color: #1d1f27; border-color: #d4d2c8; }
  [data-theme="light"] button.secondary, [data-theme="light"] .tab, [data-theme="light"] .gear, [data-theme="light"] .mode-card, [data-theme="light"] .back-link { background: #efeee8; color: #3a3d48; border-color: #d4d2c8; }
  [data-theme="light"] .tab.on { background: #e0a840; color: #1a1206; }
  [data-theme="light"] label, [data-theme="light"] .hint, [data-theme="light"] .mode-card .mc-desc, [data-theme="light"] .member-list { color: #6b6f7c; }
  [data-theme="light"] .sw { color: #1d1f27; }
</style>
</head>
<body>
<div class="card">
  <h1 id="mainTitle">💬 チャットを選ぶ</h1>

  <!-- ① モード選択 -->
  <div id="modeSelect">
    <button class="mode-card" data-mode="personal">
      <span class="mc-icon">🔑</span>
      <span>
        <span class="mc-title">個人チャット</span><br>
        <span class="mc-desc">部屋コードを共有した1人と、音声通話+チャット</span>
      </span>
    </button>
    <button class="mode-card" data-mode="group">
      <span class="mc-icon">👥</span>
      <span>
        <span class="mc-title">グループチャット</span><br>
        <span class="mc-desc">部屋コードを知っている複数人でテキストチャット(人数上限あり)</span>
      </span>
    </button>
    <button class="mode-card" data-mode="random">
      <span class="mc-icon">🎲</span>
      <span>
        <span class="mc-title">ランダムチャット</span><br>
        <span class="mc-desc">コード不要。待機中の誰かと自動でマッチングし、音声通話+チャット</span>
      </span>
    </button>
    <button class="mode-card" data-mode="open">
      <span class="mc-icon">🏠</span>
      <span>
        <span class="mc-title">オープンチャット</span><br>
        <span class="mc-desc">公開中の部屋一覧から参加、または自分で部屋を作ってテキストチャット</span>
      </span>
    </button>
  </div>

  <!-- ② 個人/グループ:コード入力 -->
  <div id="codeSetup" class="hidden">
    <button class="back-link" data-back="1">← 戻る</button>

    <label>表示名</label>
    <input id="nameInput" placeholder="例: ABC" maxlength="20" />

    <label>部屋コード</label>
    <input id="codeInput" class="code" placeholder="例: ABC123" maxlength="8" />
    <p class="hint">同じコードを入力した人同士がマッチングされます</p>

    <div id="groupOptions" class="hidden">
      <label>人数上限(2〜20人・部屋を新規に作る場合のみ有効)</label>
      <input id="groupLimitInput" type="number" min="2" max="20" value="10" />
    </div>

    <div id="personalOptions">
      <label class="sw"><input type="checkbox" id="preMic">マイクをミュートして入室</label>
      <label class="sw"><input type="checkbox" id="preSpk">スピーカーをミュートして入室</label>
    </div>

    <p class="error hidden" id="codeError"></p>
    <button id="codeJoinBtn">入室する</button>
  </div>

  <!-- ③ ランダムチャット:入室前 -->
  <div id="randomSetup" class="hidden">
    <button class="back-link" data-back="1">← 戻る</button>

    <label>表示名</label>
    <input id="randomNameInput" placeholder="例: ABC" maxlength="20" />
    <p class="hint">ボタンを押すと、同じタイミングで待っている誰かと自動でマッチングします</p>

    <label class="sw"><input type="checkbox" id="randomPreMic">マイクをミュートして入室</label>
    <label class="sw"><input type="checkbox" id="randomPreSpk">スピーカーをミュートして入室</label>

    <p class="error hidden" id="randomError"></p>
    <button id="randomJoinBtn">ランダムマッチング開始</button>
  </div>

  <!-- ④ 待機中(個人/ランダム共通) -->
  <div id="waiting" class="hidden">
    <div class="spinner" aria-hidden="true"></div>
    <p class="status" id="waitingStatus">相手の入室を待っています<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    <div class="code-badge hidden" id="waitingCode"></div>
    <p class="hint hidden" id="waitingHint" style="text-align:center;">このコードを相手に共有してください</p>
    <button id="cancelBtn" class="secondary">キャンセル</button>
  </div>

  <!-- ⑤ 通話中(個人/ランダム共通:音声+チャット) -->
  <div id="matched" class="hidden chat-screen">
    <div class="chat-header">
      <button id="leaveBtn" class="icon-btn" aria-label="退出する">←</button>
      <div class="chat-header-info">
        <div class="chat-header-name" id="matchedStatus"></div>
        <div class="chat-header-sub" id="callState"></div>
      </div>
    </div>
    <div class="mute-row">
      <button id="muteBtn" class="secondary">🎤 ミュートする</button>
      <button id="spkMuteBtn" class="secondary">🔊 スピーカーをミュートする</button>
    </div>
    <div id="chatBox" class="chat-box chat-box-tall"></div>
    <div id="replyPreview" class="reply-preview hidden">
      <span class="rp-text" id="replyPreviewText"></span>
      <button id="replyPreviewCancel" aria-label="返信を取り消す">✕</button>
    </div>
    <div id="typingIndicator" class="typing-indicator hidden">
      <span class="dots"><span>●</span><span>●</span><span>●</span></span>
      <span id="typingText"></span>
    </div>
    <div class="composer">
      <input id="msgInput" placeholder="メッセージを入力" />
      <button id="sendBtn" class="send-btn" aria-label="送信">➤</button>
    </div>
  </div>

  <!-- ⑤.5 オープンチャット:公開部屋一覧 -->
  <div id="openList" class="hidden">
    <button class="back-link" data-back="1">← 戻る</button>

    <label>表示名</label>
    <input id="openListNameInput" placeholder="例: ABC" maxlength="20" />

    <button id="openCreateBtn">＋ 新しい部屋を作る</button>
    <p class="hint" id="openListHint" style="text-align:center;">読み込み中…</p>
    <div id="openRoomList"></div>
  </div>

  <!-- ⑤.6 オープンチャット:部屋作成 -->
  <div id="openCreate" class="hidden">
    <button class="back-link" data-back-open="1">← 一覧に戻る</button>

    <label>表示名</label>
    <input id="openNameInput" placeholder="例: ABC" maxlength="20" />

    <label>部屋名</label>
    <input id="openTitleInput" placeholder="例: 雑談しましょう" maxlength="30" />

    <label>タグ(最大3つ)</label>
    <div class="tag-picker" id="openTagPicker"></div>

    <label class="sw"><input type="checkbox" id="openLockedToggle">招待コードが必要な部屋にする(鍵マーク付き)</label>
    <p class="hint" style="margin-top:-8px;">オンにすると、作成後に招待コードが表示されます。コードを知っている人だけが参加できます</p>

    <label>参加できる人</label>
    <select id="openRestrictionSel">
      <option value="none">制限なし(誰でも参加可)</option>
      <option value="account">アカウントをお持ちの方のみ</option>
      <option value="verified">認証済み(Googleアカウント)の方のみ</option>
    </select>

    <label>人数上限(2〜50人)</label>
    <input id="openLimitInput" type="number" min="2" max="50" value="10" />

    <p class="error hidden" id="openCreateError"></p>
    <button id="openCreateSubmitBtn">この内容で部屋を作る</button>
  </div>

  <!-- ⑥ グループチャット中(テキストのみ・オープンチャットもここを共用) -->
  <div id="groupRoom" class="hidden">
    <p class="status" id="groupStatus"></p>
    <p class="member-list" id="groupMembers"></p>
    <div id="groupChatBox" class="chat-box"></div>
    <div id="mentionList" class="mention-list hidden"></div>
    <div id="groupReplyPreview" class="reply-preview hidden">
      <span class="rp-text" id="groupReplyPreviewText"></span>
      <button id="groupReplyPreviewCancel" aria-label="返信を取り消す">✕</button>
    </div>
    <div id="groupTypingIndicator" class="typing-indicator hidden">
      <span class="dots"><span>●</span><span>●</span><span>●</span></span>
      <span id="groupTypingText"></span>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <input id="groupMsgInput" placeholder="メッセージを入力(@で相手を選べます)" />
      <button id="groupSendBtn">送信</button>
    </div>
    <button id="groupLeaveBtn" class="secondary">退出する</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<button id="gearBtn" class="gear" aria-label="設定">⚙️</button>
<div id="settingsOverlay" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><b>設定</b><button id="closeSettings" class="x">✕</button></div>
    <div class="tabs">
      <button class="tab on" data-tab="account">アカウント</button>
      <button class="tab" data-tab="notify">通知</button>
      <button class="tab" data-tab="audio">音声</button>
      <button class="tab" data-tab="theme">テーマ</button>
    </div>

    <div class="panel" data-panel="account"><div id="accountBody"></div></div>

    <div class="panel hidden" data-panel="notify">
      <label class="sw"><input type="checkbox" id="notifyToggle">デスクトップ・プッシュ通知</label>
      <p class="hint" id="notifyHint" style="margin:0;"></p>
    </div>

    <div class="panel hidden" data-panel="audio">
      <label>マイク</label><select id="micSel"></select>
      <label>マイク音量 <span id="micVolVal"></span></label><input type="range" id="micVol" min="0" max="200" />
      <label>スピーカー</label><select id="spkSel"></select>
      <p class="hint" id="spkHint" style="margin-top:-8px;"></p>
      <label>スピーカー音量 <span id="spkVolVal"></span></label><input type="range" id="spkVol" min="0" max="100" />
      <label class="sw"><input type="checkbox" id="echoToggle">エコー除去</label>
      <label class="sw"><input type="checkbox" id="noiseToggle">ノイズ抑制</label>
      <label class="sw"><input type="checkbox" id="joinMicMute">マイクをミュートして入室</label>
      <label class="sw"><input type="checkbox" id="joinSpkMute">スピーカーをミュートして入室</label>
      <label>マイクテスト(話すとバーが動きます)</label>
      <div class="meter"><i id="meterBar"></i></div>
      <button id="micTestBtn" class="secondary">テスト開始</button>
    </div>

    <div class="panel hidden" data-panel="theme">
      <label class="sw"><input type="radio" name="theme" value="system">端末の設定に合わせる</label>
      <label class="sw"><input type="radio" name="theme" value="dark">ダーク</label>
      <label class="sw"><input type="radio" name="theme" value="light">ライト</label>

      <label>自分のユーザー名の色</label>
      <div class="row" style="margin-bottom:12px;">
        <input type="color" id="myNameColor" style="height:40px; padding:2px;">
        <button id="myNameReset" class="secondary">リセット</button>
      </div>

      <label>自分の文字色</label>
      <div class="row" style="margin-bottom:12px;">
        <input type="color" id="myMsgColor" style="height:40px; padding:2px;">
        <button id="myMsgReset" class="secondary">リセット</button>
      </div>

      <label class="sw"><input type="checkbox" id="blockPartnerColor">相手のカラー変更をブロック</label>
      <p class="hint" style="margin-top:-8px;">オンにすると、相手が設定した名前や文字の色は表示せず、標準の色で表示します</p>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/call.js"></script>
<script>
  const socket = io();

  // 通報によるブロックのための、ブラウザごとの匿名ID(アカウントとは無関係)。
  // 同じブラウザで使い続ける限り、ブロックした相手とは今後マッチングしない。
  function getClientId() {
    try {
      let id = localStorage.getItem("clientId");
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2)));
        localStorage.setItem("clientId", id);
      }
      return id;
    } catch { return null; }
  }
  const myClientId = getClientId();

  // ---------- 画面切り替え ----------
  const SCREENS = ["modeSelect", "codeSetup", "randomSetup", "waiting", "matched", "groupRoom", "openList", "openCreate"];
  const OPEN_TAGS = ["雑談", "ゲーム", "音楽", "勉強", "その他"];
  const mainTitle = document.getElementById("mainTitle");
  function showScreen(name, title) {
    SCREENS.forEach((id) => document.getElementById(id).classList.toggle("hidden", id !== name));
    if (title) mainTitle.textContent = title;
  }

  let currentMode = null; // 'personal' | 'group' | 'random'
  let myGroupName = null; // グループチャットでの自分の表示名(メンション判定に使用)
  let groupMemberNames = []; // グループチャットの現在の参加者名(メンション候補・ハイライトに使用)

  // ---------- アイコン画像(アバター) ----------
  // 自分のアイコンは設定パネル(settings.js)が localStorage に保存する。
  // ここではそれを読み、通話/チャットの相手に送る。
  function getMyAvatar() {
    try { return localStorage.getItem("myAvatar") || null; } catch { return null; }
  }
  let partnerAvatar = null; // 個人/ランダムチャット(1対1)の相手のアイコン
  let groupAvatars = new Map(); // グループチャット: socketId -> アイコン(data URL)
  let personalPartnerName = null; // 個人/ランダムチャット(1対1)の相手の名前(リアクションの「誰が」表示用)
  let groupNamesById = new Map(); // グループチャット: socketId -> 名前(同上)

  // 入室前に画面をまっさらにしておく(直後に届く履歴を、重複なくきれいに表示するため)
  function resetChatUiBeforeJoin() {
    chatBox.innerHTML = "";
    groupChatBox.innerHTML = "";
    messageEls.clear();
    replyTarget = null;
    replyPreview.classList.add("hidden");
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
    personalTyping.clear();
    groupTyping.clear();
  }

  function resolveName(socketId, isGroup) {
    if (socketId === socket.id) return "自分";
    if (isGroup) return groupNamesById.get(socketId) || "不明なユーザー";
    return personalPartnerName || "相手";
  }

  // 設定パネルでアイコンを変更したら、表示中のメッセージにも反映する
  window.addEventListener("avatarchange", () => {
    document.querySelectorAll('.msg-flat.mine .avatar-circle').forEach((el) => setAvatarEl(el, getMyAvatar()));
  });

  function setAvatarEl(el, url, fallbackLetter) {
    el.innerHTML = "";
    if (url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "";
      el.appendChild(img);
    } else {
      el.textContent = fallbackLetter || "";
    }
  }

  document.querySelectorAll(".mode-card").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentMode = btn.dataset.mode;
      document.getElementById("codeError").classList.add("hidden");
      document.getElementById("randomError").classList.add("hidden");
      if (currentMode === "random") {
        showScreen("randomSetup", "🎲 ランダムチャット");
      } else if (currentMode === "open") {
        showScreen("openList", "🏠 オープンチャット");
        refreshOpenRoomList();
      } else {
        document.getElementById("personalOptions").classList.toggle("hidden", currentMode !== "personal");
        document.getElementById("groupOptions").classList.toggle("hidden", currentMode !== "group");
        showScreen("codeSetup", currentMode === "group" ? "👥 グループチャット" : "🔑 個人チャット");
      }
    });
  });

  document.querySelectorAll("[data-back]").forEach((btn) => {
    btn.addEventListener("click", () => showScreen("modeSelect", "💬 チャットを選ぶ"));
  });
  document.querySelectorAll("[data-back-open]").forEach((btn) => {
    btn.addEventListener("click", () => {
      showScreen("openList", "🏠 オープンチャット");
      refreshOpenRoomList();
    });
  });

  // ---------- 個人/グループ:コード入室 ----------
  const nameInput = document.getElementById("nameInput");
  const codeInput = document.getElementById("codeInput");
  const codeError = document.getElementById("codeError");
  const codeJoinBtn = document.getElementById("codeJoinBtn");
  const groupLimitInput = document.getElementById("groupLimitInput");

  function normalizeCode(raw) {
    const halfWidth = raw.replace(/[\uFF01-\uFF5E]/g, (ch) =>
      String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
    );
    return halfWidth.trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  }

  codeInput.addEventListener("input", () => {
    const cursorAtEnd = codeInput.selectionStart === codeInput.value.length;
    codeInput.value = normalizeCode(codeInput.value);
    if (cursorAtEnd) codeInput.selectionStart = codeInput.selectionEnd = codeInput.value.length;
  });

  function showCodeError(text) {
    codeError.textContent = text;
    codeError.classList.toggle("hidden", !text);
  }

  codeJoinBtn.addEventListener("click", () => {
    const displayName = nameInput.value.trim() || "名無し";
    const code = normalizeCode(codeInput.value);
    if (!code) { showCodeError("部屋コードを入力してください"); return; }
    showCodeError("");
    resetChatUiBeforeJoin();
    const payload = { displayName, code, mode: currentMode, avatar: getMyAvatar(), clientId: myClientId };
    if (currentMode === "group") {
      let limit = parseInt(groupLimitInput.value, 10);
      if (!Number.isFinite(limit)) limit = 10;
      payload.limit = Math.min(20, Math.max(2, limit));
      myGroupName = displayName;
    }
    socket.emit("join_room", payload);
  });

  // ---------- ランダムチャット:入室 ----------
  const randomNameInput = document.getElementById("randomNameInput");
  const randomError = document.getElementById("randomError");
  const randomJoinBtn = document.getElementById("randomJoinBtn");

  function showRandomError(text) {
    randomError.textContent = text;
    randomError.classList.toggle("hidden", !text);
  }

  randomJoinBtn.addEventListener("click", () => {
    const displayName = randomNameInput.value.trim() || "名無し";
    showRandomError("");
    resetChatUiBeforeJoin();
    socket.emit("join_random", { displayName, avatar: getMyAvatar(), clientId: myClientId });
  });

  // ---------- 待機画面 ----------
  const waitingCodeEl = document.getElementById("waitingCode");
  const waitingHint = document.getElementById("waitingHint");
  const waitingStatus = document.getElementById("waitingStatus");
  const cancelBtn = document.getElementById("cancelBtn");

  function renderWaiting(code) {
    const text = currentMode === "random" ? "お相手を探しています" : "相手の入室を待っています";
    waitingStatus.innerHTML = text + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    if (code) {
      waitingCodeEl.textContent = code;
      waitingCodeEl.classList.remove("hidden");
      waitingHint.classList.remove("hidden");
    } else {
      waitingCodeEl.classList.add("hidden");
      waitingHint.classList.add("hidden");
    }
  }

  cancelBtn.addEventListener("click", () => {
    socket.emit("leave_room");
    showScreen("modeSelect", "💬 チャットを選ぶ");
  });

  socket.on("join_error", ({ message }) => {
    if (currentMode === "random") showRandomError(message);
    else if (currentMode === "open") alert(message);
    else showCodeError(message);
  });

  socket.on("waiting", ({ code }) => {
    renderWaiting(code);
    showScreen("waiting");
  });

  // ---------- 通話中(個人/ランダム共通) ----------
  const matchedStatus = document.getElementById("matchedStatus");
  const chatBox = document.getElementById("chatBox");
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const leaveBtn = document.getElementById("leaveBtn");
  const muteBtn = document.getElementById("muteBtn");
  const remoteAudio = document.getElementById("remoteAudio");
  const callState = document.getElementById("callState");

  let muted = false;

  leaveBtn.addEventListener("click", () => {
    VoiceCall.stop();
    socket.emit("leave_room");
    chatBox.innerHTML = "";
    messageEls.clear();
    replyTarget = null;
    replyPreview.classList.add("hidden");
    personalTyping.clear();
    showScreen("modeSelect", "💬 チャットを選ぶ");
  });

  muteBtn.addEventListener("click", () => {
    muted = !muted;
    VoiceCall.setMuted(muted);
    muteBtn.textContent = muted ? "🔇 ミュート解除" : "🎤 ミュートする";
  });

  socket.on("matched", ({ partnerName, partnerAvatar: pa, initiator }) => {
    matchedStatus.textContent = partnerName;
    partnerAvatar = pa || null;
    personalPartnerName = partnerName;
    muted = false;
    muteBtn.textContent = "🎤 ミュートする";
    // chatBox は入室時(resetChatUiBeforeJoin)で既に空にしてあり、
    // この直前に届いた履歴(chat_history)がそこに描画されているので、ここでは消さない。
    showScreen("matched", currentMode === "random" ? "🎲 ランダムチャット" : "🔑 個人チャット");
    addSystemMessage(chatBox, `✅ ${partnerName} さんとマッチングしました！`);
    callState.textContent = "通話: 接続準備中…";
    VoiceCall.start(socket, initiator, remoteAudio, (s) => {
      callState.textContent = s === "no-mic" ? "通話: マイクなし(相手の声だけ聞こえます)" : "通話: " + s;
    }).catch((e) => {
      console.error(e);
      callState.textContent = "通話: 接続に失敗しました";
    });
  });

  socket.on("partner_left", () => {
    VoiceCall.stop();
    socket.emit("leave_room");
    chatBox.innerHTML = "";
    messageEls.clear();
    replyTarget = null;
    replyPreview.classList.add("hidden");
    personalTyping.clear();
    showScreen("modeSelect", "💬 チャットを選ぶ");
    showCodeError("相手が退出しました。もう一度入室できます。");
  });

  // ---------- グループチャット中 ----------
  const groupStatus = document.getElementById("groupStatus");
  const groupMembers = document.getElementById("groupMembers");
  const groupChatBox = document.getElementById("groupChatBox");
  const groupMsgInput = document.getElementById("groupMsgInput");
  const groupSendBtn = document.getElementById("groupSendBtn");
  const groupLeaveBtn = document.getElementById("groupLeaveBtn");

  groupLeaveBtn.addEventListener("click", () => {
    socket.emit("leave_room");
    groupChatBox.innerHTML = "";
    messageEls.clear();
    myGroupName = null;
    groupMemberNames = [];
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
    groupTyping.clear();
    currentOpenRoomTitle = null;
    showScreen("modeSelect", "💬 チャットを選ぶ");
  });

  let currentOpenRoomTitle = null; // オープンチャットとして入っている場合、その部屋名(ヘッダー表示用)

  socket.on("group_update", ({ code, members, limit, joinedName, leftName }) => {
    // 自分がまだ入室画面を見ていない(=これが自分自身の入室)場合は、入室メッセージを出さない
    const alreadyInRoom = currentMode === "group" && !document.getElementById("groupRoom").classList.contains("hidden");
    const wasOpen = currentMode === "open";
    currentMode = "group";
    groupMemberNames = members.map((m) => m.name);
    groupAvatars = new Map(members.map((m) => [m.socketId, m.avatar || null]));
    groupNamesById = new Map(members.map((m) => [m.socketId, m.name]));
    if (alreadyInRoom) {
      if (joinedName) addSystemMessage(groupChatBox, `👋 ${joinedName} さんが入室しました`);
      if (leftName) addSystemMessage(groupChatBox, `🚪 ${leftName} さんが退出しました`);
    }
    const label = currentOpenRoomTitle ? `🏠 ${currentOpenRoomTitle}` : "👥 グループチャット";
    groupStatus.textContent = `${label}(${members.length}/${limit}人) コード: ${code}`;
    groupMembers.textContent = "参加者: " + members.map((m) => m.name).join("、");
    showScreen("groupRoom", label);
  });

  // ---------- オープンチャット(公開ロビー) ----------
  const openListNameInput = document.getElementById("openListNameInput");
  const openCreateBtn = document.getElementById("openCreateBtn");
  const openListHint = document.getElementById("openListHint");
  const openRoomList = document.getElementById("openRoomList");
  const openNameInput = document.getElementById("openNameInput");
  const openTitleInput = document.getElementById("openTitleInput");
  const openTagPicker = document.getElementById("openTagPicker");
  const openLockedToggle = document.getElementById("openLockedToggle");
  const openRestrictionSel = document.getElementById("openRestrictionSel");
  const openLimitInput = document.getElementById("openLimitInput");
  const openCreateError = document.getElementById("openCreateError");
  const openCreateSubmitBtn = document.getElementById("openCreateSubmitBtn");

  // 表示名は3つの入口(一覧・作成・前回値)で使い回す
  function getOpenName() {
    try { return localStorage.getItem("openDisplayName") || ""; } catch { return ""; }
  }
  function setOpenName(v) {
    try { localStorage.setItem("openDisplayName", v); } catch {}
  }
  [openListNameInput, openNameInput].forEach((el) => {
    el.value = getOpenName();
    el.addEventListener("change", () => setOpenName(el.value.trim()));
  });

  let selectedTags = [];
  function renderTagPicker() {
    openTagPicker.innerHTML = "";
    OPEN_TAGS.forEach((tag) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tag-chip" + (selectedTags.includes(tag) ? " on" : "");
      b.textContent = tag;
      b.addEventListener("click", () => {
        if (selectedTags.includes(tag)) {
          selectedTags = selectedTags.filter((t) => t !== tag);
        } else if (selectedTags.length < 3) {
          selectedTags = [...selectedTags, tag];
        }
        renderTagPicker();
      });
      openTagPicker.appendChild(b);
    });
  }

  function restrictionLabel(r) {
    return r === "account" ? "🔒 アカウント限定" : r === "verified" ? "🔒 認証済み限定" : null;
  }

  // 参加制限のチェック(クライアント側のみの簡易ゲート。詳しくは会話内の説明の通り)
  function canEnterRestrictedRoom(restriction) {
    const au = window.authUser || { signedIn: false, verified: false };
    if (restriction === "account" && !au.signedIn) {
      alert("この部屋はアカウントをお持ちの方のみ参加できます。右上の設定からサインインしてください。");
      return false;
    }
    if (restriction === "verified" && !au.verified) {
      alert("この部屋は認証済み(Googleアカウント)の方のみ参加できます。右上の設定からGoogleでサインインしてください。");
      return false;
    }
    return true;
  }

  function refreshOpenRoomList() {
    openListHint.textContent = "読み込み中…";
    openRoomList.innerHTML = "";
    socket.emit("list_open_rooms");
  }

  socket.on("open_rooms_list", ({ rooms }) => {
    openRoomList.innerHTML = "";
    if (!rooms.length) {
      openListHint.textContent = "今は公開中の部屋がありません。最初の部屋を作ってみましょう";
      return;
    }
    openListHint.textContent = "";
    rooms.forEach((r) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "open-room-card";

      const title = document.createElement("div");
      title.className = "or-title";
      title.textContent = (r.locked ? "🔑 " : "") + r.title;
      card.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "or-meta";
      const count = document.createElement("span");
      count.textContent = `${r.memberCount}/${r.limit}人`;
      meta.appendChild(count);
      r.tags.forEach((t) => {
        const tag = document.createElement("span");
        tag.className = "or-tag";
        tag.textContent = t;
        meta.appendChild(tag);
      });
      const rl = restrictionLabel(r.memberRestriction);
      if (rl) {
        const rEl = document.createElement("span");
        rEl.textContent = rl;
        meta.appendChild(rEl);
      }
      card.appendChild(meta);

      card.addEventListener("click", () => {
        if (!canEnterRestrictedRoom(r.memberRestriction)) return;
        const displayName = (openListNameInput.value.trim() || "名無し");
        setOpenName(displayName);
        let inviteCode = "";
        if (r.locked) {
          inviteCode = prompt(`「${r.title}」は招待コードが必要です。コードを入力してください。`) || "";
          if (!inviteCode.trim()) return;
        }
        resetChatUiBeforeJoin();
        socket.emit("join_open_room", {
          displayName, code: r.code, inviteCode: inviteCode.trim(),
          avatar: getMyAvatar(), clientId: myClientId,
        });
      });

      openRoomList.appendChild(card);
    });
  });

  openCreateBtn.addEventListener("click", () => {
    openNameInput.value = openListNameInput.value || getOpenName();
    openTitleInput.value = "";
    selectedTags = [];
    renderTagPicker();
    openLockedToggle.checked = false;
    openRestrictionSel.value = "none";
    openLimitInput.value = 10;
    openCreateError.classList.add("hidden");
    showScreen("openCreate", "🏠 部屋を作る");
  });

  openCreateSubmitBtn.addEventListener("click", () => {
    const displayName = openNameInput.value.trim() || "名無し";
    setOpenName(displayName);
    let limit = parseInt(openLimitInput.value, 10);
    if (!Number.isFinite(limit)) limit = 10;
    limit = Math.min(50, Math.max(2, limit));

    resetChatUiBeforeJoin();
    socket.emit("create_open_room", {
      displayName,
      title: openTitleInput.value.trim(),
      tags: selectedTags,
      locked: openLockedToggle.checked,
      memberRestriction: openRestrictionSel.value,
      limit,
      avatar: getMyAvatar(),
      clientId: myClientId,
    });
  });

  socket.on("open_room_created", ({ title, inviteCode }) => {
    currentOpenRoomTitle = title;
    if (inviteCode) {
      alert(`部屋「${title}」を作成しました。\n\n招待コード: ${inviteCode}\n\nこのコードを知っている人だけが参加できます。参加してほしい人に共有してください。`);
    }
  });

  // ---------- チャット共通処理 ----------
  const HEX_RE = /^#[0-9a-f]{6}$/i;
  const isColorBlocked = () => {
    try { return localStorage.getItem("blockPartnerColor") === "1"; } catch { return false; }
  };
  // 相手のメッセージに、受け取った色を反映する(ブロック中は標準色に戻す)
  function applyPartnerColors() {
    const blocked = isColorBlocked();
    document.querySelectorAll(".msg-flat.them").forEach((el) => {
      const nc = el.dataset.nameColor;
      const tc = el.dataset.textColor;
      const nameEl = el.querySelector(".msg-name");
      const textEl = el.querySelector(".msg-text");
      if (nameEl) nameEl.style.color = !blocked && nc ? nc : "";
      if (textEl) textEl.style.color = !blocked && tc ? tc : "";
    });
  }
  // 自分が設定している色(送信時に相手へ渡す)
  function getMyColors() {
    const get = (k) => {
      try {
        const v = localStorage.getItem(k);
        return HEX_RE.test(v || "") ? v : null;
      } catch { return null; }
    };
    return { nameColor: get("myNameColor"), textColor: get("myMsgColor") };
  }

  function formatTime(ts) {
    const d = ts ? new Date(ts) : new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function addSystemMessage(targetBox, text) {
    const p = document.createElement("div");
    p.className = "system-msg";
    p.textContent = text;
    targetBox.appendChild(p);
    targetBox.scrollTop = targetBox.scrollHeight;
  }

  // ---------- メンション(@名前) ----------
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  // 本文中の「@メンバー名」を強調表示する。自分宛てのメンションが含まれていたら true を返す。
  // 名前を DOM ノードとして個別に組み立てるため、innerHTML は使わずXSS対策も維持している。
  function renderTextWithMentions(container, text) {
    if (!groupMemberNames.length) { container.textContent = text; return false; }
    const names = [...new Set(groupMemberNames)].sort((a, b) => b.length - a.length).map(escapeRegExp);
    const re = new RegExp("@(" + names.join("|") + ")", "g");
    let lastIndex = 0;
    let match;
    let mentionsMe = false;
    while ((match = re.exec(text))) {
      if (match.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      const span = document.createElement("span");
      span.className = "mention";
      span.textContent = "@" + match[1];
      container.appendChild(span);
      if (myGroupName && match[1] === myGroupName) mentionsMe = true;
      lastIndex = re.lastIndex;
    }
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
    return mentionsMe;
  }

  // ---------- 既読・リアクション・編集・返信: id ごとの DOM 参照を保持 ----------
  // 個人/ランダム(chatBox)とグループ(groupChatBox)を跨いでも id は部屋コード付きで一意
  const messageEls = new Map(); // id -> { row, body, head, textEl, reactionRow, readEl, mine, isGroup, name, text, targetBox }

  const EMOJI_SET = ["👍", "😂", "❤️", "😮", "😢", "🎉", "👎", "🙏"];

  // ---------- 下から出る操作シート(汎用) ----------
  function closeActionSheet() {
    const el = document.getElementById("msgActionOverlay");
    if (el) el.remove();
  }
  function openActionSheet(buildFn) {
    closeActionSheet();
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "msgActionOverlay";
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    buildFn(sheet);
    overlay.appendChild(sheet);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeActionSheet(); });
    document.body.appendChild(overlay);
  }
  function sheetActionButton(label, danger, fn) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sheet-action" + (danger ? " danger" : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  // メッセージ長押し → 絵文字クイック選択 + 編集/返信/コピー
  function openMessageActionSheet(id) {
    const ref = messageEls.get(id);
    if (!ref) return;
    openActionSheet((sheet) => {
      const emojiRow = document.createElement("div");
      emojiRow.className = "quick-emoji-row";
      EMOJI_SET.forEach((em) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = em;
        b.addEventListener("click", () => {
          socket.emit("toggle_reaction", { id, emoji: em });
          closeActionSheet();
        });
        emojiRow.appendChild(b);
      });
      sheet.appendChild(emojiRow);

      if (ref.mine) {
        sheet.appendChild(sheetActionButton("✏️ メッセージを編集", false, () => {
          closeActionSheet();
          startEditMessage(id);
        }));
      }
      sheet.appendChild(sheetActionButton("↩️ 返信", false, () => {
        closeActionSheet();
        setReplyTarget(id, ref.isGroup);
      }));
      sheet.appendChild(sheetActionButton("📋 テキストをコピー", false, () => {
        closeActionSheet();
        copyText(ref.text);
      }));

      if (!ref.mine) {
        const divider = document.createElement("div");
        divider.style.height = "10px";
        sheet.appendChild(divider);
        sheet.appendChild(sheetActionButton("🚩 通報", true, () => {
          closeActionSheet();
          const ok = confirm("この発言を通報しますか?\n送信者は自動的にブロックされ、今後ランダムチャットでマッチングしなくなります。");
          if (!ok) return;
          socket.emit("report_message", { id });
          alert("通報しました。ご協力ありがとうございます。");
        }));
      }
    });
  }

  // 長押し(スマホ)・マウス長押し(PC)・右クリックで操作シートを開く
  function bindLongPress(row, id) {
    let timer = null;
    let moved = false;
    const start = () => { moved = false; timer = setTimeout(() => openMessageActionSheet(id), 420); };
    const cancel = () => { if (timer) clearTimeout(timer); timer = null; };
    row.addEventListener("touchstart", start, { passive: true });
    row.addEventListener("touchend", cancel);
    row.addEventListener("touchmove", () => { moved = true; cancel(); });
    row.addEventListener("mousedown", start);
    row.addEventListener("mouseup", cancel);
    row.addEventListener("mouseleave", cancel);
    row.addEventListener("contextmenu", (e) => { e.preventDefault(); openMessageActionSheet(id); });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }

  // ---------- 編集 ----------
  function startEditMessage(id) {
    const ref = messageEls.get(id);
    if (!ref || !ref.mine) return;
    ref.textEl.innerHTML = "";
    const box = document.createElement("div");
    box.className = "edit-box";
    const textarea = document.createElement("textarea");
    textarea.value = ref.text;
    const actions = document.createElement("div");
    actions.className = "edit-actions";
    const saveBtn = document.createElement("button");
    saveBtn.type = "button"; saveBtn.textContent = "保存";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button"; cancelBtn.className = "secondary"; cancelBtn.textContent = "キャンセル";
    saveBtn.addEventListener("click", () => {
      const v = textarea.value.trim();
      if (!v) return;
      socket.emit("edit_message", { id, text: v });
    });
    cancelBtn.addEventListener("click", () => renderMessageText(ref));
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    box.appendChild(textarea);
    box.appendChild(actions);
    ref.textEl.appendChild(box);
    textarea.focus();
  }

  function renderMessageText(ref) {
    ref.textEl.innerHTML = "";
    if (ref.replyTo) ref.textEl.appendChild(buildReplyQuote(ref.replyTo, ref.isGroup));

    let mentionsMe = false;
    if (ref.isGroup) {
      const span = document.createElement("span");
      mentionsMe = renderTextWithMentions(span, ref.text);
      ref.textEl.appendChild(span);
    } else {
      ref.textEl.appendChild(document.createTextNode(ref.text));
    }

    if (ref.edited) {
      const tag = document.createElement("span");
      tag.className = "edited-tag";
      tag.textContent = "(編集済み)";
      ref.textEl.appendChild(tag);
    }

    ref.row.classList.toggle("mention-me", mentionsMe);
    if (!ref.mine) applyPartnerColors();
  }

  socket.on("message_edited", ({ id, text }) => {
    const ref = messageEls.get(id);
    if (!ref) return;
    ref.text = text;
    ref.edited = true;
    renderMessageText(ref);
  });

  // ---------- 返信 ----------
  let replyTarget = null; // 個人/ランダム用
  let groupReplyTarget = null; // グループ用
  const replyPreview = document.getElementById("replyPreview");
  const replyPreviewText = document.getElementById("replyPreviewText");
  const groupReplyPreview = document.getElementById("groupReplyPreview");
  const groupReplyPreviewText = document.getElementById("groupReplyPreviewText");

  function setReplyTarget(id, isGroup) {
    const ref = messageEls.get(id);
    if (!ref) return;
    const who = ref.mine ? "自分" : ref.name;
    const snippet = ref.text.length > 40 ? ref.text.slice(0, 40) + "…" : ref.text;
    const target = { id, name: who, text: snippet };
    if (isGroup) {
      groupReplyTarget = target;
      groupReplyPreviewText.textContent = `${who}: ${snippet}`;
      groupReplyPreview.classList.remove("hidden");
      groupMsgInput.focus();
    } else {
      replyTarget = target;
      replyPreviewText.textContent = `${who}: ${snippet}`;
      replyPreview.classList.remove("hidden");
      msgInput.focus();
    }
  }
  document.getElementById("replyPreviewCancel").addEventListener("click", () => {
    replyTarget = null;
    replyPreview.classList.add("hidden");
  });
  document.getElementById("groupReplyPreviewCancel").addEventListener("click", () => {
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
  });

  function buildReplyQuote(replyTo, isGroup) {
    const q = document.createElement("div");
    q.className = "reply-quote";

    const origRef = messageEls.get(replyTo.id);
    const letter = (replyTo.name || "?").trim().slice(0, 1).toUpperCase();
    let avatarUrl = null;
    if (origRef) {
      avatarUrl = origRef.mine ? getMyAvatar() : (isGroup ? groupAvatars.get(origRef.from) : partnerAvatar);
    }
    const avatarEl = document.createElement("span");
    avatarEl.className = "rq-avatar";
    setAvatarEl(avatarEl, avatarUrl, letter);

    const nameEl = document.createElement("span");
    nameEl.className = "rq-name";
    nameEl.textContent = replyTo.name;

    const textEl = document.createElement("span");
    textEl.className = "rq-text";
    textEl.textContent = replyTo.text;

    q.appendChild(avatarEl);
    q.appendChild(nameEl);
    q.appendChild(textEl);

    q.addEventListener("click", (e) => {
      e.stopPropagation();
      const target = messageEls.get(replyTo.id);
      if (target) target.row.scrollIntoView({ block: "center", behavior: "smooth" });
    });
    return q;
  }

  // ---------- リアクション(押すと「誰が押したか」が見られる) ----------
  function renderReactions(id, reactions) {
    const ref = messageEls.get(id);
    if (!ref) return;
    ref.reactionRow.innerHTML = "";
    reactions.forEach(({ emoji, socketIds }) => {
      if (!socketIds.length) return;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "reaction-pill" + (socketIds.includes(socket.id) ? " mine" : "");
      b.textContent = emoji + " " + socketIds.length;
      b.addEventListener("click", () => openReactorSheet(id, emoji, socketIds, ref.isGroup));
      ref.reactionRow.appendChild(b);
    });
  }
  socket.on("reaction_update", ({ id, reactions }) => renderReactions(id, reactions));

  function openReactorSheet(id, emoji, socketIds, isGroup) {
    openActionSheet((sheet) => {
      const title = document.createElement("div");
      title.className = "sheet-title";
      title.textContent = emoji;
      sheet.appendChild(title);
      socketIds.forEach((sid) => {
        const row = document.createElement("div");
        row.className = "reactor-row";
        row.textContent = resolveName(sid, isGroup);
        sheet.appendChild(row);
      });
      const mine = socketIds.includes(socket.id);
      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "secondary";
      toggleBtn.style.marginTop = "12px";
      toggleBtn.textContent = mine ? "自分のリアクションを取り消す" : "自分もこの絵文字でリアクションする";
      toggleBtn.addEventListener("click", () => {
        socket.emit("toggle_reaction", { id, emoji });
        closeActionSheet();
      });
      sheet.appendChild(toggleBtn);
    });
  }

  function renderReadReceipt(id, count) {
    const ref = messageEls.get(id);
    if (!ref || !ref.mine) return;
    ref.readEl.textContent = count > 0 ? (count > 1 ? `既読 ${count}` : "既読") : "";
  }
  socket.on("read_update", ({ id, count }) => renderReadReceipt(id, count));

  // 相手からのメッセージが画面に表示され、かつタブがアクティブなら既読を送る
  function maybeMarkRead(id, mine) {
    if (mine || document.hidden) return;
    socket.emit("read_message", { id });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    // 画面復帰時、表示中の未既読メッセージをまとめて既読にする
    messageEls.forEach((ref, id) => { if (!ref.mine) socket.emit("read_message", { id }); });
  });

  function renderMessage(targetBox, { id, from, name, text, nameColor, textColor, replyTo, ts }) {
    const mine = from === socket.id;
    const isGroup = targetBox === groupChatBox;

    const row = document.createElement("div");
    row.className = "msg-flat " + (mine ? "mine" : "them");
    row.dataset.id = id;
    if (!mine && HEX_RE.test(nameColor || "")) row.dataset.nameColor = nameColor;
    if (!mine && HEX_RE.test(textColor || "")) row.dataset.textColor = textColor;

    const avatar = document.createElement("span");
    avatar.className = "avatar-circle";
    const letter = (name || "?").trim().slice(0, 1).toUpperCase();
    const avatarUrl = mine ? getMyAvatar() : (isGroup ? groupAvatars.get(from) : partnerAvatar);
    setAvatarEl(avatar, avatarUrl, letter);

    const body = document.createElement("div");
    body.className = "msg-body";

    const head = document.createElement("div");
    head.className = "msg-head";
    const nameEl = document.createElement("span");
    nameEl.className = "msg-name";
    nameEl.textContent = mine ? "自分" : name;
    const timeEl = document.createElement("span");
    timeEl.className = "msg-time";
    timeEl.textContent = formatTime(ts);
    head.appendChild(nameEl);
    head.appendChild(timeEl);

    const textEl = document.createElement("div");
    textEl.className = "msg-text";

    const reactionRow = document.createElement("div");
    reactionRow.className = "reaction-row";

    const readEl = document.createElement("div");
    readEl.className = "read-receipt";

    body.appendChild(head);
    body.appendChild(textEl);
    body.appendChild(reactionRow);
    if (mine) body.appendChild(readEl);
    row.appendChild(avatar);
    row.appendChild(body);

    targetBox.appendChild(row);
    const ref = { row, body, head, textEl, reactionRow, readEl, mine, isGroup, name, from, text, replyTo: replyTo || null, edited: false, targetBox };
    messageEls.set(id, ref);
    renderMessageText(ref);
    bindLongPress(row, id);
    targetBox.scrollTop = targetBox.scrollHeight;

    maybeMarkRead(id, mine);
  }

  socket.on("chat_message", (data) => {
    const targetBox = currentMode === "group" ? groupChatBox : chatBox;
    renderMessage(targetBox, data);
  });

  // 入室直後に届く、直近1日分の履歴をまとめて描画する
  socket.on("chat_history", ({ messages }) => {
    if (!Array.isArray(messages) || !messages.length) return;
    // オープンチャットは、group_update が届く前にこのイベントが先着するため
    // currentMode がまだ "open" のままのことがある → group と同じ箱に出す
    const targetBox = (currentMode === "group" || currentMode === "open") ? groupChatBox : chatBox;
    messages.forEach((m) => {
      renderMessage(targetBox, m);
      if (m.reactions && m.reactions.length) renderReactions(m.id, m.reactions);
      if (m.edited) {
        const ref = messageEls.get(m.id);
        if (ref) { ref.edited = true; renderMessageText(ref); }
      }
    });
    if (messages.length) addSystemMessage(targetBox, "— ここより上は直近1日の履歴 —");
  });

  // ---------- 入力中インジケーター ----------
  function makeTypingTracker(indicatorEl, textEl) {
    const timers = new Map();
    function refresh() {
      const names = [...timers.keys()];
      if (!names.length) { indicatorEl.classList.add("hidden"); return; }
      textEl.textContent = names.join("、") + " が入力中…";
      indicatorEl.classList.remove("hidden");
    }
    return {
      add(name) {
        if (timers.has(name)) clearTimeout(timers.get(name));
        timers.set(name, setTimeout(() => { timers.delete(name); refresh(); }, 3000));
        refresh();
      },
      clear() {
        timers.forEach((t) => clearTimeout(t));
        timers.clear();
        indicatorEl.classList.add("hidden");
      },
    };
  }
  const personalTyping = makeTypingTracker(document.getElementById("typingIndicator"), document.getElementById("typingText"));
  const groupTyping = makeTypingTracker(document.getElementById("groupTypingIndicator"), document.getElementById("groupTypingText"));

  socket.on("typing", ({ name }) => {
    (currentMode === "group" ? groupTyping : personalTyping).add(name);
  });

  let lastTypingEmit = 0;
  function emitTyping() {
    const now = Date.now();
    if (now - lastTypingEmit < 1500) return;
    lastTypingEmit = now;
    socket.emit("typing");
  }
  msgInput.addEventListener("input", emitTyping);

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    const payload = { text, ...getMyColors() };
    if (replyTarget) payload.replyTo = replyTarget;
    socket.emit("send_message", payload);
    msgInput.value = "";
    replyTarget = null;
    replyPreview.classList.add("hidden");
    lastTypingEmit = 0;
  }
  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  // ---------- メンション候補(@入力時に一致する参加者名を表示) ----------
  const mentionList = document.getElementById("mentionList");

  function hideMentionList() {
    mentionList.classList.add("hidden");
    mentionList.innerHTML = "";
  }

  function updateMentionSuggestions() {
    const val = groupMsgInput.value;
    const caret = groupMsgInput.selectionStart;
    const uptoCaret = val.slice(0, caret);
    const atIndex = uptoCaret.lastIndexOf("@");
    if (atIndex === -1 || /\s/.test(uptoCaret.slice(atIndex + 1))) { hideMentionList(); return; }

    const partial = uptoCaret.slice(atIndex + 1).toLowerCase();
    const candidates = groupMemberNames.filter((n) => n.toLowerCase().includes(partial)).slice(0, 5);
    if (candidates.length === 0) { hideMentionList(); return; }

    mentionList.innerHTML = "";
    candidates.forEach((n) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "@" + n;
      // mousedown で処理する(click だと先に input の blur が走ってしまうため)
      b.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const before = val.slice(0, atIndex);
        const after = val.slice(caret);
        groupMsgInput.value = before + "@" + n + " " + after;
        hideMentionList();
        groupMsgInput.focus();
      });
      mentionList.appendChild(b);
    });
    mentionList.classList.remove("hidden");
  }

  groupMsgInput.addEventListener("input", updateMentionSuggestions);
  groupMsgInput.addEventListener("input", emitTyping);
  groupMsgInput.addEventListener("blur", () => { setTimeout(hideMentionList, 150); });

  function sendGroupMessage() {
    const text = groupMsgInput.value.trim();
    if (!text) return;
    const payload = { text, ...getMyColors() };
    if (groupReplyTarget) payload.replyTo = groupReplyTarget;
    socket.emit("send_message", payload);
    groupMsgInput.value = "";
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
    hideMentionList();
    lastTypingEmit = 0;
  }
  groupSendBtn.addEventListener("click", sendGroupMessage);
  groupMsgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendGroupMessage(); });
</script>

<script>
// 自分のユーザー名の色・文字色を変更する(設定 > テーマ)
(() => {
  const root = document.documentElement;
  const load = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const save = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
  const toHex = (rgb) =>
    '#' + rgb.match(/\d+/g).slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('');

  // 現在のテーマでの標準色(ピッカーの初期表示用)
  function probe() {
    const el = document.createElement('div');
    el.className = 'msg-flat mine';
    el.style.cssText = 'position:absolute; visibility:hidden;';
    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name';
    el.appendChild(nameEl);
    document.body.appendChild(el);
    const c = getComputedStyle(nameEl).color;
    el.remove();
    return toHex(c);
  }

  function setupColor({ key, attr, cssVar, inputId, resetId }) {
    const input = document.getElementById(inputId);
    const resetBtn = document.getElementById(resetId);
    const sync = () => { input.value = probe(); };
    const apply = (c) => { root.style.setProperty(cssVar, c); root.setAttribute(attr, ''); };

    const saved = load(key);
    if (saved) { apply(saved); input.value = saved; } else { sync(); }

    input.addEventListener('input', (e) => { apply(e.target.value); save(key, e.target.value); });

    resetBtn.addEventListener('click', () => {
      root.style.removeProperty(cssVar);
      root.removeAttribute(attr);
      save(key, null);
      sync();
    });

    // テーマ切り替え時、未カスタムならピッカー表示を標準色に追従させる
    new MutationObserver(() => { if (!load(key)) sync(); })
      .observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  }

  setupColor({ key: 'myNameColor', attr: 'data-custom-name', cssVar: '--my-name-color',
               inputId: 'myNameColor', resetId: 'myNameReset' });
  setupColor({ key: 'myMsgColor', attr: 'data-custom-me', cssVar: '--my-msg-color',
               inputId: 'myMsgColor', resetId: 'myMsgReset' });

  // 相手のカラー変更をブロック(切り替えると表示中のメッセージにもすぐ反映)
  const blockEl = document.getElementById('blockPartnerColor');
  blockEl.checked = load('blockPartnerColor') === '1';
  blockEl.addEventListener('change', () => {
    save('blockPartnerColor', blockEl.checked ? '1' : null);
    applyPartnerColors();
  });
})();
</script>
</body>
</html>
