<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>部屋コード マッチング</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #12141c;
    color: #e7e6e2;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #181b25;
    border: 1px solid #2a2e3a;
    border-radius: 16px;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 16px; text-align: center; }
  label { font-size: 12px; color: #8a8f9e; display: block; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #33384a;
    background: #0f111a;
    color: #fff;
    margin-bottom: 12px;
    font-size: 14px;
  }
  input.code { font-family: monospace; letter-spacing: 0.2em; }
  .hint { font-size: 11px; color: #5f6473; margin: -8px 0 12px; }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: #e0a840;
    color: #1a1206;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    font-size: 14px;
  }
  button.secondary { background: #20242f; color: #c7cad3; border: 1px solid #33384a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 13px; color: #e0a840; margin: 8px 0 16px; text-align: center; }
  .error { font-size: 12px; color: #ff6b6b; margin: 4px 0 12px; }
  .code-badge {
    font-family: monospace;
    letter-spacing: 0.3em;
    font-size: 20px;
    text-align: center;
    background: #0f111a;
    border: 1px solid #33384a;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .chat-box {
    height: 260px;
    overflow-y: auto;
    background: #0f111a;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .msg { margin-bottom: 6px; font-size: 14px; }
  .msg .who { font-size: 11px; opacity: .6; margin-right: 4px; }
  .msg.me { color: #e0a840; text-align: right; }
  .msg.them { color: #c7cad3; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; margin-bottom: 0; }
  .row button { width: auto; padding: 10px 16px; margin-bottom: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 部屋コード マッチング</h1>

  <div id="setup">
    <label>表示名</label>
    <input id="nameInput" placeholder="例: ゆめみ" maxlength="20" />

    <label>部屋コード</label>
    <input id="codeInput" class="code" placeholder="例: ABC123" maxlength="8" />
    <p class="hint">同じコードを入力した人同士がマッチングされます</p>

    <p class="error hidden" id="errorMsg"></p>
    <button id="joinBtn">入室する</button>
  </div>

  <div id="waiting" class="hidden">
    <p class="status">相手の入室を待っています…</p>
    <div class="code-badge" id="waitingCode"></div>
    <p class="hint" style="text-align:center;">このコードを相手に共有してください</p>
    <button id="cancelBtn" class="secondary">キャンセル</button>
  </div>

  <div id="matched" class="hidden">
    <p class="status" id="matchedStatus"></p>
    <p class="hint" id="callState" style="text-align:center;"></p>
    <button id="muteBtn" class="secondary">🎤 ミュートする</button>
    <div id="chatBox" class="chat-box"></div>
    <div class="row" style="margin-bottom:8px;">
      <input id="msgInput" placeholder="メッセージを入力" />
      <button id="sendBtn">送信</button>
    </div>
    <button id="leaveBtn" class="secondary">退出する</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/call.js"></script>
<script>
  const socket = io();

  const setupEl = document.getElementById("setup");
  const waitingEl = document.getElementById("waiting");
  const matchedEl = document.getElementById("matched");

  const nameInput = document.getElementById("nameInput");
  const codeInput = document.getElementById("codeInput");
  const errorMsg = document.getElementById("errorMsg");
  const joinBtn = document.getElementById("joinBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const waitingCode = document.getElementById("waitingCode");
  const matchedStatus = document.getElementById("matchedStatus");
  const chatBox = document.getElementById("chatBox");
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const leaveBtn = document.getElementById("leaveBtn");
  const muteBtn = document.getElementById("muteBtn");
  const remoteAudio = document.getElementById("remoteAudio");

  let muted = false;

  function normalizeCode(raw) {
    const halfWidth = raw.replace(/[\uFF01-\uFF5E]/g, (ch) =>
      String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
    );
    return halfWidth.trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  }

  codeInput.addEventListener("input", () => {
    const cursorAtEnd = codeInput.selectionStart === codeInput.value.length;
    codeInput.value = normalizeCode(codeInput.value);
    if (cursorAtEnd) {
      codeInput.selectionStart = codeInput.selectionEnd = codeInput.value.length;
    }
  });

  function showScreen(name) {
    setupEl.classList.toggle("hidden", name !== "setup");
    waitingEl.classList.toggle("hidden", name !== "waiting");
    matchedEl.classList.toggle("hidden", name !== "matched");
  }

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.classList.toggle("hidden", !text);
  }

  joinBtn.addEventListener("click", () => {
    const displayName = nameInput.value.trim() || "名無し";
    const code = normalizeCode(codeInput.value);
    if (!code) {
      showError("部屋コードを入力してください");
      return;
    }
    showError("");
    socket.emit("join_room", { displayName, code });
  });

  cancelBtn.addEventListener("click", () => {
    socket.emit("leave_room");
    showScreen("setup");
  });

  leaveBtn.addEventListener("click", () => {
    VoiceCall.stop();
    socket.emit("leave_room");
    chatBox.innerHTML = "";
    showScreen("setup");
  });

  muteBtn.addEventListener("click", () => {
    muted = !muted;
    VoiceCall.setMuted(muted);
    muteBtn.textContent = muted ? "🔇 ミュート解除" : "🎤 ミュートする";
  });

  socket.on("join_error", ({ message }) => {
    showError(message);
  });

  socket.on("waiting", ({ code }) => {
    waitingCode.textContent = code;
    showScreen("waiting");
  });

  socket.on("matched", ({ partnerName, initiator }) => {
    matchedStatus.textContent = `✅ ${partnerName} さんとマッチングしました！`;
    muted = false;
    muteBtn.textContent = "🎤 ミュートする";
    showScreen("matched");
    const callState = document.getElementById("callState");
    callState.textContent = "通話: 接続準備中…";
    VoiceCall.start(socket, initiator, remoteAudio, (s) => {
      callState.textContent = "通話: " + s;
    }).catch(() => {
      matchedStatus.textContent += "(マイクが使えないため音声通話は無効です)";
    });
  });

  socket.on("chat_message", ({ from, name, text }) => {
    const div = document.createElement("div");
    const mine = from === socket.id;
    div.className = "msg " + (mine ? "me" : "them");
    // textContent を使い、名前・本文に含まれるHTMLを実行させない(XSS対策)
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = mine ? "自分" : name;
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  socket.on("partner_left", () => {
    VoiceCall.stop();
    // サーバー側の部屋にも自分が残っているので、明示的に退出しておく
    socket.emit("leave_room");
    chatBox.innerHTML = "";
    showScreen("setup");
    showError("相手が退出しました。もう一度入室できます。");
  });

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    socket.emit("send_message", { text });
    msgInput.value = "";
  }
  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
