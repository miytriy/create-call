<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta name="google" content="notranslate" />
<title>Talkie</title>
<style>
  /* ===== デザイントークン ===== */
  :root {
    --bg: #0b0d14;
    --bg-glow-1: rgba(99,102,241,.22);
    --bg-glow-2: rgba(236,72,153,.14);
    --surface: rgba(24,27,40,.72);
    --surface-solid: #161926;
    --surface-2: #1e2233;
    --surface-3: #262b3f;
    --input-bg: #0f121d;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --text: #eceef6;
    --text-sub: #9aa1b8;
    --text-mute: #6b7189;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-soft: rgba(99,102,241,.16);
    --accent-text: #a5b4fc;
    --danger: #f87171;
    --ok: #34d399;
    --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #d946ef 100%);
    --shadow: 0 20px 50px -20px rgba(0,0,0,.7), 0 2px 0 rgba(255,255,255,.04) inset;
    --radius: 18px;
    --rq-line-color: #3a4152;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f5fb;
    --bg-glow-1: rgba(99,102,241,.16);
    --bg-glow-2: rgba(236,72,153,.10);
    --surface: rgba(255,255,255,.82);
    --surface-solid: #ffffff;
    --surface-2: #f0f1f8;
    --surface-3: #e6e8f3;
    --input-bg: #f6f7fc;
    --border: rgba(20,24,50,.08);
    --border-strong: rgba(20,24,50,.16);
    --text: #161a2b;
    --text-sub: #5a6078;
    --text-mute: #8b91a8;
    --accent-soft: rgba(99,102,241,.12);
    --accent-text: #4f46e5;
    --danger: #e11d48;
    --shadow: 0 20px 50px -24px rgba(40,50,110,.35), 0 1px 0 rgba(255,255,255,.8) inset;
    --rq-line-color: #c9cce0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; background: var(--bg); overscroll-behavior-y: none; }
  [data-theme="light"] { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    font-family: var(--font);
    background:
      radial-gradient(900px 500px at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, var(--bg-glow-2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 28px 14px 40px;
    min-height: 100vh;
    min-height: 100dvh; /* スマホのアドレスバー分の余計なスクロールを防ぐ */
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px 22px 26px;
    box-shadow: var(--shadow);
    align-self: flex-start;
  }
  h1 {
    font-family: var(--font);
    font-size: 19px; font-weight: 800; letter-spacing: -.01em;
    margin: 0 0 20px; text-align: center;
  }

  label { font-size: 12px; font-weight: 600; color: var(--text-sub); display: block; margin-bottom: 6px; letter-spacing: .02em; }
  input, select, textarea { font-family: inherit; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: var(--input-bg);
    color: var(--text);
    margin-bottom: 14px;
    font-size: 14px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input::placeholder { color: var(--text-mute); }
  input.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .28em; font-weight: 600; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  select {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border-strong);
    background: var(--input-bg); color: var(--text); margin-bottom: 14px; font-size: 14px;
  }
  .hint { font-size: 11.5px; color: var(--text-mute); margin: -8px 0 14px; }

  button {
    font-family: inherit;
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: none;
    background: var(--grad);
    color: #fff;
    font-weight: 700;
    letter-spacing: .01em;
    cursor: pointer;
    margin-bottom: 10px;
    font-size: 14px;
    box-shadow: 0 10px 24px -12px rgba(99,102,241,.85);
    transition: transform .12s ease, filter .15s ease, box-shadow .15s ease, background .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.975); }
  button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  button.secondary {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); box-shadow: none; font-weight: 600;
  }
  button.secondary:hover { background: var(--surface-3); filter: none; }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .status { font-size: 13px; color: var(--accent-text); margin: 8px 0 18px; text-align: center; font-weight: 600; }
  .error { font-size: 12px; color: var(--danger); margin: 4px 0 12px; font-weight: 600; }
  .code-badge {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .38em; font-size: 22px; font-weight: 700; text-align: center;
    background: var(--input-bg);
    border: 1px dashed var(--border-strong);
    border-radius: 16px; padding: 14px; margin-bottom: 12px; color: var(--accent-text);
  }

  .chat-box {
    height: 260px; overflow-y: auto;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 18px; padding: 10px; margin-bottom: 12px;
    scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent;
  }
  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 6px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; margin-bottom: 0; }
  .row button { width: auto; padding: 10px 16px; margin-bottom: 0; }
  .hidden, #modeSelect.hidden { display: none !important; }

  /* --- 画面切り替え --- */
  @keyframes screenIn { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: none; } }
  .screen-enter { animation: screenIn .28s cubic-bezier(.2,.8,.2,1); }

  /* --- モード選択(2x2) --- */
  #modeSelect { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode-card {
    position: relative; overflow: hidden;
    width: 100%; text-align: center; padding: 20px 10px 18px; border-radius: 20px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: none;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .mode-card::before {
    content: ""; position: absolute; inset: 0; background: var(--grad); opacity: 0; transition: opacity .2s ease;
  }
  .mode-card > * { position: relative; }
  .mode-card:hover { transform: translateY(-3px); border-color: var(--accent); filter: none; box-shadow: 0 16px 30px -18px rgba(99,102,241,.7); }
  .mode-card:hover::before { opacity: .10; }
  .mode-card:active { transform: scale(.97); }
  .mode-card .mc-icon {
    font-family: var(--font); font-size: 28px; font-weight: 500; line-height: 1;
    width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;
    background: var(--accent-soft); margin-bottom: 4px;
  }
  .mode-card .mc-title { font-weight: 700; font-size: 13.5px; }
  .mode-card .mc-desc { font-size: 11px; color: var(--text-sub); line-height: 1.4; font-weight: 500; }

  .back-link {
    width: auto; margin: 0 0 16px; padding: 7px 14px; background: var(--surface-2); color: var(--text-sub);
    font-size: 12px; font-weight: 600; border: 1px solid var(--border); border-radius: 999px; box-shadow: none;
    font-family: var(--font);
  }
  .back-link:hover { background: var(--surface-3); filter: none; color: var(--text); }
  .member-list { font-size: 12px; color: var(--text-sub); margin: -6px 0 10px; word-break: break-all; }

  /* --- チャットヘッダー --- */
  .chat-header { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-size: 16px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header-sub { font-size: 11.5px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    width: 38px; height: 38px; flex: none; margin: 0; padding: 0;
    border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
    font-size: 16px;  box-shadow: none; display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--surface-3); filter: none; }
  .mute-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .mute-row button { margin-bottom: 0; font-size: 12px; padding: 10px 6px; border-radius: 999px; font-family: var(--font); }
  .chat-box-tall { height: 340px; }
  .system-msg {
    text-align: center; font-size: 11px; color: var(--text-sub); margin: 8px auto 14px;
    background: var(--surface-2); border: 1px solid var(--border); width: fit-content; max-width: 92%;
    padding: 4px 12px; border-radius: 999px;
  }

  /* --- メッセージ --- */
  .msg-flat {
    display: flex; gap: 10px; padding: 8px 8px; border-radius: 14px; position: relative;
    transition: background .15s ease;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .msg-flat:hover { background: rgba(127,127,160,.07); }
  .avatar-circle {
    width: 36px; height: 36px; border-radius: 50%; flex: none; margin-top: 1px;
    background: var(--grad); color: #fff; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 6px 14px -8px rgba(99,102,241,.9);
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg-body { flex: 1; min-width: 0; }
  .msg-head { display: flex; align-items: baseline; gap: 8px; }
  .msg-name { font-size: 13px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verified-badge {
    flex: none; width: 15px; height: 15px; border-radius: 50%; background: var(--grad); color: #fff;
    font-size: 9px; line-height: 15px; text-align: center; font-weight: 800;
  }
  .rq-name .verified-badge, .reactor-row .verified-badge { margin-left: 3px; vertical-align: -1px; display: inline-block; }
  .msg-time { font-size: 10.5px; color: var(--text-mute); flex: none; }
  .msg-text { font-size: 14px; line-height: 1.55; margin-top: 2px; word-break: break-word; white-space: pre-wrap; font-family: var(--font), var(--emoji); }
  .msg-flat.mine .msg-name { color: var(--my-name-color, var(--accent-text)); }
  .msg-flat.mine .msg-text { color: var(--my-msg-color, inherit); }
  .mention { color: var(--accent-text); font-weight: 800; background: var(--accent-soft); padding: 0 4px; border-radius: 6px; }
  .msg-flat.mention-me { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .read-receipt { font-size: 10.5px; color: var(--text-mute); margin-top: 3px; text-align: right; }

  /* --- リアクション --- */
  .reaction-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .reaction-pill {
    width: auto; margin: 0; padding: 3px 10px; font-size: 12.5px; border-radius: 999px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); box-shadow: none;
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--font), var(--emoji);
  }
  .reaction-pill:hover { background: var(--surface-3); filter: none; }
  .reaction-pill.mine { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }

  /* --- 長押しシート --- */
  .quick-emoji-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 4px 18px; }
  .quick-emoji-row button {
    width: 48px; height: 48px; font-size: 23px; border-radius: 50%; flex: none; font-family: var(--emoji);
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); margin: 0; padding: 0; box-shadow: none;
  }
  .quick-emoji-row button:hover { background: var(--surface-3); transform: scale(1.12); filter: none; }
  .quick-emoji-row button:active { background: var(--accent-soft); }
  .sheet-action {
    width: 100%; text-align: left; margin: 0; padding: 15px 8px; font-size: 14.5px; font-weight: 600;
    background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text); border-radius: 0; box-shadow: none;
  }
  .sheet-action:hover { background: var(--surface-2); filter: none; }
  .sheet-action:last-child { border-bottom: none; }
  .sheet-action.danger { color: var(--danger); }
  .reactor-row { padding: 10px 6px; font-size: 14px; border-bottom: 1px solid var(--border); }
  .reactor-row:last-child { border-bottom: none; }
  .sheet-title { font-size: 22px; font-weight: 800; text-align: center; margin: 0 0 10px; font-family: var(--emoji), var(--font); }

  /* --- 編集 --- */
  .edit-box textarea {
    width: 100%; min-height: 64px; padding: 10px 12px; border-radius: 14px;
    border: 1px solid var(--border-strong); background: var(--input-bg); color: var(--text); font-size: 14px;
    font-family: inherit; margin-bottom: 8px; resize: vertical;
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions button { width: auto; margin: 0; padding: 7px 16px; font-size: 12px; border-radius: 999px; }
  .edited-tag { font-size: 10.5px; color: var(--text-mute); margin-left: 4px; }

  /* --- 返信の引用 --- */
  .msg-avatar-col { display: flex; flex: none; }
  .rq-avatar {
    width: 16px; height: 16px; border-radius: 50%; flex: none; overflow: hidden;
    background: var(--grad); color: #fff; font-size: 8px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .rq-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reply-quote-line {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-sub);
    margin: 0 0 3px 10px; max-width: calc(100% - 10px); cursor: pointer;
  }
  .reply-quote-line .rq-name { font-weight: 800; color: var(--text); flex: none; }
  .reply-quote-line .rq-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rq-connector-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  /* --- 送信欄(返信バーと一体) --- */
  .composer-wrap {
    border-radius: 22px; overflow: hidden; background: var(--input-bg); border: 1px solid var(--border-strong);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .reply-preview {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--accent-soft); border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .reply-preview.hidden { display: none; }
  .reply-preview .rp-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-sub); }
  .reply-preview .rp-text b { color: var(--accent-text); font-weight: 800; }
  .reply-preview .rp-mention {
    width: auto; margin: 0; padding: 3px 10px; background: var(--surface-2); border: 1px solid var(--border-strong);
    color: var(--text-sub); font-size: 11px; font-weight: 800; border-radius: 999px; flex: none; box-shadow: none;
  }
  .reply-preview .rp-mention.on { background: var(--grad); border-color: transparent; color: #fff; }
  .reply-preview .rp-cancel {
    width: 24px; height: 24px; flex: none; margin: 0; padding: 0; border-radius: 50%;
    background: var(--surface-3); border: none; color: var(--text); font-size: 11px; line-height: 1;
     box-shadow: none; display: grid; place-items: center;
  }
  .composer-wrap .composer { padding: 4px 6px 4px 16px; }
  .composer-wrap .composer input { background: transparent; border: none; border-radius: 0; padding: 12px 0; box-shadow: none; }
  .msg-flat.reply-target-highlight {
    background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset;
    transition: background .2s ease, box-shadow .2s ease;
  }

  /* --- オープンチャット --- */
  .tag-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag-chip {
    width: auto; margin: 0; padding: 7px 15px; font-size: 12.5px; border-radius: 999px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-sub); box-shadow: none;
  }
  .tag-chip:hover { background: var(--surface-3); filter: none; }
  .tag-chip.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -10px rgba(99,102,241,.9); }
  .open-room-card {
    width: 100%; text-align: left; padding: 14px 16px; border-radius: 18px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text); cursor: pointer; margin-bottom: 10px; box-shadow: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .open-room-card:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--surface-3); filter: none; }
  .open-room-card .or-title { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; font-family: var(--font), var(--emoji); }
  .open-room-card .or-meta { font-size: 11.5px; color: var(--text-sub); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font), var(--emoji); font-weight: 500; }
  .open-room-card .or-tag { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 700; }

  /* --- 入力中 --- */
  .typing-indicator { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-sub); margin: -2px 0 8px 4px; }
  .typing-indicator.hidden { display: none; }
  .typing-indicator .dots span { font-size: 7px; margin: 0 1px; color: var(--accent-text); }

  .mention-list { display: flex; flex-direction: column; gap: 4px; margin: -4px 0 10px; }
  .mention-list button {
    width: auto; text-align: left; margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); border-radius: 12px; box-shadow: none;
  }
  .composer { display: flex; align-items: center; gap: 8px; }
  .composer input { flex: 1; margin-bottom: 0; border-radius: 999px; padding: 10px 16px; }
  .composer input:focus { outline: none; box-shadow: none; }
  .send-btn {
    width: 40px; height: 40px; flex: none; margin: 0; padding: 0; border-radius: 50%; font-size: 18px;
     display: grid; place-items: center;
    background: var(--grad); color: #fff; box-shadow: 0 8px 18px -8px rgba(99,102,241,.9);
  }

  /* --- 待機中 --- */
  .spinner {
    width: 48px; height: 48px; margin: 8px auto 18px;
    border: 4px solid var(--surface-3); border-top-color: var(--accent);
    border-right-color: var(--accent-2);
    border-radius: 50%; animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots span { animation: dotFade 1.4s infinite; opacity: 0; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotFade { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }

  /* --- 設定 --- */
  .gear {
    position: fixed; top: 14px; right: 14px; width: 42px; height: 42px; margin: 0; padding: 0; display: grid; place-items: center;
    background: var(--surface); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--border-strong); font-size: 18px; z-index: 5; border-radius: 50%; color: var(--text);
     box-shadow: var(--shadow);
  }
  .gear:hover { transform: rotate(40deg); filter: none; }
  .overlay {
    position: fixed; inset: 0; background: rgba(5,6,12,.62); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 10; transition: opacity .16s ease;
  }
  .overlay.hidden { display: none; }
  .overlay:not(.closing) { animation: overlayIn .18s ease; }
  .overlay.closing { opacity: 0; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--surface-solid);
    border: 1px solid var(--border-strong); border-bottom: none; border-radius: 28px 28px 0 0; padding: 18px 20px 26px;
    box-shadow: 0 -20px 60px -20px rgba(0,0,0,.6);
    transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s ease, max-height .18s ease;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .sheet input, .sheet textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .overlay:not(.closing) .sheet { animation: sheetIn .26s cubic-bezier(.2,.8,.2,1); }
  .overlay.closing .sheet { transform: translateY(18px); opacity: 0; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  /* 設定シートは、どのタブでも同じ高さに固定(中身が多いタブはシート内でスクロール) */
  #settingsSheet { height: min(640px, 88vh); }
  .sheet-handle { width: 42px; height: 5px; border-radius: 999px; background: var(--border-strong); margin: -6px auto 14px; cursor: grab; touch-action: none; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 17px; }
  .x {
    width: 32px; height: 32px; margin: 0; padding: 0; background: var(--surface-2); color: var(--text); border-radius: 50%;
    border: 1px solid var(--border); font-size: 13px;  box-shadow: none; display: grid; place-items: center;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; padding: 4px; background: var(--surface-2); border-radius: 999px; border: 1px solid var(--border); }
  .tab {
    flex: 1; margin: 0; padding: 8px 4px; font-size: 12px; background: transparent; color: var(--text-sub);
    border: none; border-radius: 999px; box-shadow: none; font-weight: 700;
  }
  .tab:hover { color: var(--text); filter: none; }
  .tab.on { background: var(--grad); color: #fff; box-shadow: 0 8px 16px -10px rgba(99,102,241,.9); }
  .sheet select { width: 100%; padding: 12px; margin-bottom: 14px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--input-bg); color: var(--text); }
  .sheet input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--accent); box-shadow: none; }
  .sheet input[type=checkbox], .sheet input[type=radio] { width: auto; margin: 0 10px 0 0; accent-color: var(--accent); }
  .sw { display: flex; align-items: center; font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 14px; cursor: pointer; }
  .meter { height: 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--grad); }
  .avatar { width: 56px; height: 56px; border-radius: 50%; margin-bottom: 8px; }
  .sw input[type=checkbox] { width: auto; margin: 0 10px 0 0; padding: 0; accent-color: var(--accent); }
  /* 部屋コード入力など、チェックボックス/ラジオはフォーム幅を取らない */
  input[type=checkbox], input[type=radio] { width: auto; margin-bottom: 0; box-shadow: none; }
  input[type=color] { border-radius: 12px; cursor: pointer; }
  @media (max-width: 420px) {
    body { padding: 16px 10px 32px; }
    .card { padding: 20px 16px 22px; border-radius: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="mainTitle">⇌ Talkie</h1>

  <!-- ① モード選択(2x2のコンパクトな並び) -->
  <div id="modeSelect">
    <button class="mode-card" data-mode="personal">
      <span class="mc-icon">⚿</span>
      <span class="mc-title">プライベートチャット</span>
      <span class="mc-desc">1対1・通話あり</span>
    </button>
    <button class="mode-card" data-mode="group">
      <span class="mc-icon">♺</span>
      <span class="mc-title">グループチャット</span>
      <span class="mc-desc">コードで複数人</span>
    </button>
    <button class="mode-card" data-mode="random">
      <span class="mc-icon">⚅</span>
      <span class="mc-title">ランダムチャット</span>
      <span class="mc-desc">自動マッチング</span>
    </button>
    <button class="mode-card" data-mode="open">
      <span class="mc-icon">⌂</span>
      <span class="mc-title">オープンチャット</span>
      <span class="mc-desc">公開部屋から参加</span>
    </button>
  </div>

  <!-- ② 個人/グループ:コード入力 -->
  <div id="codeSetup" class="hidden">
    <button class="back-link" data-back="1">← 戻る</button>

    <label>表示名</label>
    <input id="nameInput" placeholder="例: ABC" maxlength="20" />

    <label>部屋コード</label>
    <input id="codeInput" class="code" placeholder="例: ABC123" maxlength="8" />
    <p class="hint">同じコードを入力した人同士がマッチングされます</p>

    <div id="groupOptions" class="hidden">
      <label>人数上限(2〜20人・部屋を新規に作る場合のみ有効)</label>
      <input id="groupLimitInput" type="number" min="2" max="20" value="10" />
    </div>

    <div id="personalOptions">
      <label class="sw"><input type="checkbox" id="preMic">マイクをミュートして入室</label>
      <label class="sw"><input type="checkbox" id="preSpk">スピーカーをミュートして入室</label>
    </div>

    <p class="error hidden" id="codeError"></p>
    <button id="codeJoinBtn">入室する</button>
  </div>

  <!-- ③ ランダムチャット:入室前 -->
  <div id="randomSetup" class="hidden">
    <button class="back-link" data-back="1">← 戻る</button>

    <label>表示名</label>
    <input id="randomNameInput" placeholder="例: ABC" maxlength="20" />
    <p class="hint">ボタンを押すと、同じタイミングで待っている誰かと自動でマッチングします</p>

    <label class="sw"><input type="checkbox" id="randomPreMic">マイクをミュートして入室</label>
    <label class="sw"><input type="checkbox" id="randomPreSpk">スピーカーをミュートして入室</label>

    <p class="error hidden" id="randomError"></p>
    <button id="randomJoinBtn">ランダムマッチング開始</button>
  </div>

  <!-- ④ 待機中(個人/ランダム共通) -->
  <div id="waiting" class="hidden">
    <div class="spinner" aria-hidden="true"></div>
    <p class="status" id="waitingStatus">相手の入室を待っています<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    <div class="code-badge hidden" id="waitingCode"></div>
    <p class="hint hidden" id="waitingHint" style="text-align:center;">このコードを相手に共有してください</p>
    <button id="cancelBtn" class="secondary">キャンセル</button>
  </div>

  <!-- ⑤ 通話中(個人/ランダム共通:音声+チャット) -->
  <div id="matched" class="hidden chat-screen">
    <div class="chat-header">
      <button id="leaveBtn" class="icon-btn" aria-label="退出する">←</button>
      <div class="chat-header-info">
        <div class="chat-header-name" id="matchedStatus"></div>
        <div class="chat-header-sub" id="callState"></div>
      </div>
    </div>
    <div class="mute-row">
      <button id="muteBtn" class="secondary">🎤 ミュートする</button>
      <button id="spkMuteBtn" class="secondary">🔊 スピーカーをミュートする</button>
    </div>
    <div id="chatBox" class="chat-box chat-box-tall"></div>
    <div id="typingIndicator" class="typing-indicator hidden">
      <span class="dots"><span>●</span><span>●</span><span>●</span></span>
      <span id="typingText"></span>
    </div>
    <div class="composer-wrap">
      <div id="replyPreview" class="reply-preview hidden">
        <span class="rp-text"><b id="replyPreviewText"></b> に返信中</span>
        <button id="replyPreviewCancel" class="rp-cancel" aria-label="返信を取り消す">✕</button>
      </div>
      <div class="composer">
        <input id="msgInput" placeholder="メッセージを入力" />
        <button id="sendBtn" class="send-btn" aria-label="送信">➤</button>
      </div>
    </div>
  </div>

  <!-- ⑤.5 オープンチャット:公開部屋一覧 -->
  <div id="openList" class="hidden">
    <button class="back-link" data-back="1">← 戻る</button>

    <label>表示名</label>
    <input id="openListNameInput" placeholder="例: ABC" maxlength="20" />

    <button id="openCreateBtn">＋ 新しい部屋を作る</button>
    <p class="hint" id="openListHint" style="text-align:center;">読み込み中…</p>
    <div id="openRoomList"></div>
  </div>

  <!-- ⑤.6 オープンチャット:部屋作成 -->
  <div id="openCreate" class="hidden">
    <button class="back-link" data-back-open="1">← 一覧に戻る</button>

    <label>表示名</label>
    <input id="openNameInput" placeholder="例: ABC" maxlength="20" />

    <label>部屋名</label>
    <input id="openTitleInput" placeholder="例: 雑談しましょう" maxlength="30" />

    <label>タグ(最大3つ)</label>
    <div class="tag-picker" id="openTagPicker"></div>

    <label class="sw"><input type="checkbox" id="openLockedToggle">招待コードが必要な部屋にする(鍵マーク付き)</label>
    <p class="hint" style="margin-top:-8px;">オンにすると、作成後に招待コードが表示されます。コードを知っている人だけが参加できます</p>

    <label>参加できる人</label>
    <select id="openRestrictionSel">
      <option value="none">制限なし(誰でも参加可)</option>
      <option value="account">アカウントをお持ちの方のみ</option>
      <option value="verified">認証済み(Googleアカウント)の方のみ</option>
    </select>

    <label>人数上限(2〜50人)</label>
    <input id="openLimitInput" type="number" min="2" max="50" value="10" />

    <p class="error hidden" id="openCreateError"></p>
    <button id="openCreateSubmitBtn">この内容で部屋を作る</button>
  </div>

  <!-- ⑥ グループチャット中(テキストのみ・オープンチャットもここを共用)。個人チャットと同じ構造に統一 -->
  <div id="groupRoom" class="hidden chat-screen">
    <div class="chat-header">
      <button id="groupLeaveBtn" class="icon-btn" aria-label="退出する">←</button>
      <div class="chat-header-info">
        <div class="chat-header-name" id="groupStatus"></div>
        <div class="chat-header-sub" id="groupMembers"></div>
      </div>
    </div>
    <div id="groupChatBox" class="chat-box chat-box-tall"></div>
    <div id="mentionList" class="mention-list hidden"></div>
    <div id="groupTypingIndicator" class="typing-indicator hidden">
      <span class="dots"><span>●</span><span>●</span><span>●</span></span>
      <span id="groupTypingText"></span>
    </div>
    <div class="composer-wrap">
      <div id="groupReplyPreview" class="reply-preview hidden">
        <span class="rp-text"><b id="groupReplyPreviewText"></b> に返信中</span>
        <button id="groupReplyMentionToggle" class="rp-mention on" type="button">@ ON</button>
        <button id="groupReplyPreviewCancel" class="rp-cancel" aria-label="返信を取り消す">✕</button>
      </div>
      <div class="composer">
        <input id="groupMsgInput" placeholder="メッセージを入力(@で相手を選べます)" />
        <button id="groupSendBtn" class="send-btn" aria-label="送信">➤</button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<button id="gearBtn" class="gear" aria-label="設定">⚙︎</button>
<div id="settingsOverlay" class="overlay hidden">
  <div class="sheet" id="settingsSheet">
    <div class="sheet-handle" id="settingsSheetHandle"></div>
    <div class="sheet-head"><b>設定</b><button id="closeSettings" class="x" aria-label="閉じる">✕</button></div>
    <div class="tabs">
      <button class="tab on" data-tab="account">アカウント</button>
      <button class="tab" data-tab="notify">通知</button>
      <button class="tab" data-tab="audio">音声</button>
      <button class="tab" data-tab="theme">テーマ</button>
    </div>

    <div class="panel" data-panel="account"><div id="accountBody"></div></div>

    <div class="panel hidden" data-panel="notify">
      <label class="sw"><input type="checkbox" id="notifyToggle">デスクトップ・プッシュ通知</label>
      <p class="hint" id="notifyHint" style="margin:0;"></p>
    </div>

    <div class="panel hidden" data-panel="audio">
      <label>マイク</label><select id="micSel"></select>
      <label>マイク音量 <span id="micVolVal"></span></label><input type="range" id="micVol" min="0" max="200" />
      <label>スピーカー</label><select id="spkSel"></select>
      <p class="hint" id="spkHint" style="margin-top:-8px;"></p>
      <label>スピーカー音量 <span id="spkVolVal"></span></label><input type="range" id="spkVol" min="0" max="100" />
      <label class="sw"><input type="checkbox" id="echoToggle">エコー除去</label>
      <label class="sw"><input type="checkbox" id="noiseToggle">ノイズ抑制</label>
      <label class="sw"><input type="checkbox" id="joinMicMute">マイクをミュートして入室</label>
      <label class="sw"><input type="checkbox" id="joinSpkMute">スピーカーをミュートして入室</label>
      <label>マイクテスト(話すとバーが動きます)</label>
      <div class="meter"><i id="meterBar"></i></div>
      <button id="micTestBtn" class="secondary">テスト開始</button>
    </div>

    <div class="panel hidden" data-panel="theme">
      <label class="sw"><input type="radio" name="theme" value="system">端末の設定に合わせる</label>
      <label class="sw"><input type="radio" name="theme" value="dark">ダーク</label>
      <label class="sw"><input type="radio" name="theme" value="light">ライト</label>

      <label>自分のユーザー名の色</label>
      <div class="row" style="margin-bottom:12px;">
        <input type="color" id="myNameColor" style="height:40px; padding:2px;">
        <button id="myNameReset" class="secondary">リセット</button>
      </div>

      <label>自分の文字色</label>
      <div class="row" style="margin-bottom:12px;">
        <input type="color" id="myMsgColor" style="height:40px; padding:2px;">
        <button id="myMsgReset" class="secondary">リセット</button>
      </div>

      <label class="sw"><input type="checkbox" id="blockPartnerColor">相手のカラー変更をブロック</label>
      <p class="hint" style="margin-top:-8px;">オンにすると、相手が設定した名前や文字の色は表示せず、標準の色で表示します</p>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/call.js"></script>
<script>
  const socket = io();

  // 通報によるブロックのための、ブラウザごとの匿名ID(アカウントとは無関係)。
  // 同じブラウザで使い続ける限り、ブロックした相手とは今後マッチングしない。
  function getClientId() {
    try {
      let id = localStorage.getItem("clientId");
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2)));
        localStorage.setItem("clientId", id);
      }
      return id;
    } catch { return null; }
  }
  const myClientId = getClientId();

  // 「認証済み」(Googleサインイン)かどうか。settings.js の window.authUser を参照する。
  function isMyAccountVerified() {
    return !!(window.authUser && window.authUser.verified);
  }

  // ---------- 画面切り替え ----------
  const SCREENS = ["modeSelect", "codeSetup", "randomSetup", "waiting", "matched", "groupRoom", "openList", "openCreate"];
  const OPEN_TAGS = ["雑談", "ゲーム", "音楽", "勉強", "その他"];
  const mainTitle = document.getElementById("mainTitle");
  function showScreen(name, title) {
    SCREENS.forEach((id) => document.getElementById(id).classList.toggle("hidden", id !== name));
    if (title) mainTitle.textContent = title;
    const el = document.getElementById(name);
    el.classList.remove("screen-enter");
    void el.offsetWidth; // 強制リフロー: 同じ画面に戻ったときもアニメーションをやり直す
    el.classList.add("screen-enter");
  }

  let currentMode = null; // 'personal' | 'group' | 'random'
  let myGroupName = null; // グループチャットでの自分の表示名(メンション判定に使用)
  let groupMemberNames = []; // グループチャットの現在の参加者名(メンション候補・ハイライトに使用)

  // ---------- アイコン画像(アバター) ----------
  // 自分のアイコンは設定パネル(settings.js)が localStorage に保存する。
  // ここではそれを読み、通話/チャットの相手に送る。
  function getMyAvatar() {
    try { return localStorage.getItem("myAvatar") || null; } catch { return null; }
  }
  let partnerAvatar = null; // 個人/ランダムチャット(1対1)の相手のアイコン
  let groupAvatars = new Map(); // グループチャット: socketId -> アイコン(data URL)
  let personalPartnerName = null; // 個人/ランダムチャット(1対1)の相手の名前(リアクションの「誰が」表示用)
  let personalPartnerVerified = false; // 同上、相手が認証済みかどうか
  let groupNamesById = new Map(); // グループチャット: socketId -> 名前(同上)
  let groupVerifiedById = new Map(); // グループチャット: socketId -> 認証済みかどうか(同上)

  function resolveVerified(socketId, isGroup) {
    if (socketId === socket.id) return isMyAccountVerified();
    if (isGroup) return !!groupVerifiedById.get(socketId);
    return personalPartnerVerified;
  }

  // 入室前に画面をまっさらにしておく(直後に届く履歴を、重複なくきれいに表示するため)
  function resetChatUiBeforeJoin() {
    chatBox.innerHTML = "";
    groupChatBox.innerHTML = "";
    messageEls.clear();
    replyTarget = null;
    replyPreview.classList.add("hidden");
    clearReplyHighlight();
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
    clearReplyHighlight();
    personalTyping.clear();
    groupTyping.clear();
  }

  function resolveName(socketId, isGroup) {
    if (socketId === socket.id) return "自分";
    if (isGroup) return groupNamesById.get(socketId) || "不明なユーザー";
    return personalPartnerName || "相手";
  }

  // 設定パネルでアイコンを変更したら、表示中のメッセージにも反映する
  window.addEventListener("avatarchange", () => {
    document.querySelectorAll('.msg-flat.mine .avatar-circle').forEach((el) => setAvatarEl(el, getMyAvatar()));
  });

  function setAvatarEl(el, url, fallbackLetter) {
    el.innerHTML = "";
    if (url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "";
      el.appendChild(img);
    } else {
      el.textContent = fallbackLetter || "";
    }
  }

  document.querySelectorAll(".mode-card").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentMode = btn.dataset.mode;
      document.getElementById("codeError").classList.add("hidden");
      document.getElementById("randomError").classList.add("hidden");
      if (currentMode === "random") {
        showScreen("randomSetup", "⚅ ランダムチャット");
      } else if (currentMode === "open") {
        showScreen("openList", "⌂ オープンチャット");
        refreshOpenRoomList();
      } else {
        document.getElementById("personalOptions").classList.toggle("hidden", currentMode !== "personal");
        document.getElementById("groupOptions").classList.toggle("hidden", currentMode !== "group");
        showScreen("codeSetup", currentMode === "group" ? "♺ グループチャット" : "⚿ プライベートチャット");
      }
    });
  });

  document.querySelectorAll("[data-back]").forEach((btn) => {
    btn.addEventListener("click", () => showScreen("modeSelect", "💬 チャットを選ぶ"));
  });
  document.querySelectorAll("[data-back-open]").forEach((btn) => {
    btn.addEventListener("click", () => {
      showScreen("openList", "⌂ オープンチャット");
      refreshOpenRoomList();
    });
  });

  // ---------- 個人/グループ:コード入室 ----------
  const nameInput = document.getElementById("nameInput");
  const codeInput = document.getElementById("codeInput");
  const codeError = document.getElementById("codeError");
  const codeJoinBtn = document.getElementById("codeJoinBtn");
  const groupLimitInput = document.getElementById("groupLimitInput");

  function normalizeCode(raw) {
    const halfWidth = raw.replace(/[\uFF01-\uFF5E]/g, (ch) =>
      String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
    );
    return halfWidth.trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  }

  codeInput.addEventListener("input", () => {
    const cursorAtEnd = codeInput.selectionStart === codeInput.value.length;
    codeInput.value = normalizeCode(codeInput.value);
    if (cursorAtEnd) codeInput.selectionStart = codeInput.selectionEnd = codeInput.value.length;
  });

  function showCodeError(text) {
    codeError.textContent = text;
    codeError.classList.toggle("hidden", !text);
  }

  codeJoinBtn.addEventListener("click", () => {
    const displayName = nameInput.value.trim() || "名無し";
    const code = normalizeCode(codeInput.value);
    if (!code) { showCodeError("部屋コードを入力してください"); return; }
    showCodeError("");
    resetChatUiBeforeJoin();
    const payload = { displayName, code, mode: currentMode, avatar: getMyAvatar(), clientId: myClientId, verified: isMyAccountVerified() };
    if (currentMode === "group") {
      let limit = parseInt(groupLimitInput.value, 10);
      if (!Number.isFinite(limit)) limit = 10;
      payload.limit = Math.min(20, Math.max(2, limit));
      myGroupName = displayName;
    }
    socket.emit("join_room", payload);
  });

  // ---------- ランダムチャット:入室 ----------
  const randomNameInput = document.getElementById("randomNameInput");
  const randomError = document.getElementById("randomError");
  const randomJoinBtn = document.getElementById("randomJoinBtn");

  function showRandomError(text) {
    randomError.textContent = text;
    randomError.classList.toggle("hidden", !text);
  }

  randomJoinBtn.addEventListener("click", () => {
    const displayName = randomNameInput.value.trim() || "名無し";
    showRandomError("");
    resetChatUiBeforeJoin();
    socket.emit("join_random", { displayName, avatar: getMyAvatar(), clientId: myClientId, verified: isMyAccountVerified() });
  });

  // ---------- 待機画面 ----------
  const waitingCodeEl = document.getElementById("waitingCode");
  const waitingHint = document.getElementById("waitingHint");
  const waitingStatus = document.getElementById("waitingStatus");
  const cancelBtn = document.getElementById("cancelBtn");

  // ---------- チャット共通処理 ----------
  const HEX_RE = /^#[0-9a-f]{6}$/i;
  const isColorBlocked = () => {
    try { return localStorage.getItem("blockPartnerColor") === "1"; } catch { return false; }
  };
  // 相手のメッセージに、受け取った色を反映する(ブロック中は標準色に戻す)
  function applyPartnerColors() {
    const blocked = isColorBlocked();
    document.querySelectorAll(".msg-flat.them").forEach((el) => {
      const nc = el.dataset.nameColor;
      const tc = el.dataset.textColor;
      const nameEl = el.querySelector(".msg-name");
      const textEl = el.querySelector(".msg-text");
      if (nameEl) nameEl.style.color = !blocked && nc ? nc : "";
      if (textEl) textEl.style.color = !blocked && tc ? tc : "";
    });
  }
  // 自分が設定している色(送信時に相手へ渡す)
  function getMyColors() {
    const get = (k) => {
      try {
        const v = localStorage.getItem(k);
        return HEX_RE.test(v || "") ? v : null;
      } catch { return null; }
    };
    return { nameColor: get("myNameColor"), textColor: get("myMsgColor") };
  }

  function formatTime(ts) {
    const d = ts ? new Date(ts) : new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function addSystemMessage(targetBox, text) {
    const p = document.createElement("div");
    p.className = "system-msg";
    p.textContent = text;
    targetBox.appendChild(p);
    targetBox.scrollTop = targetBox.scrollHeight;
  }

  // ---------- メンション(@名前) ----------
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  // 本文中の「@メンバー名」を強調表示する。自分宛てのメンションが含まれていたら true を返す。
  // 名前を DOM ノードとして個別に組み立てるため、innerHTML は使わずXSS対策も維持している。
  function renderTextWithMentions(container, text) {
    if (!groupMemberNames.length) { container.textContent = text; return false; }
    const names = [...new Set(groupMemberNames)].sort((a, b) => b.length - a.length).map(escapeRegExp);
    const re = new RegExp("@(" + names.join("|") + ")", "g");
    let lastIndex = 0;
    let match;
    let mentionsMe = false;
    while ((match = re.exec(text))) {
      if (match.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      const span = document.createElement("span");
      span.className = "mention";
      span.textContent = "@" + match[1];
      container.appendChild(span);
      if (myGroupName && match[1] === myGroupName) mentionsMe = true;
      lastIndex = re.lastIndex;
    }
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
    return mentionsMe;
  }

  // ---------- 既読・リアクション・編集・返信: id ごとの DOM 参照を保持 ----------
  // 個人/ランダム(chatBox)とグループ(groupChatBox)を跨いでも id は部屋コード付きで一意
  const messageEls = new Map(); // id -> { row, body, head, textEl, reactionRow, readEl, mine, isGroup, name, text, targetBox }

  const EMOJI_SET = ["👍", "😂", "❤️", "😮", "😢", "🎉", "👎", "🙏"];

  // ---------- シートを上にスワイプすると、その分だけ縦に伸びる(汎用) ----------
  // 設定パネル・操作シートの両方で使うため window に出しておく
  window.makeSheetDraggable = function makeSheetDraggable(sheetEl, handleEl) {
    let startY = 0, startHeight = 0, dragging = false;
    const maxH = () => window.innerHeight * 0.92;
    const start = (y) => {
      dragging = true;
      startY = y;
      startHeight = sheetEl.getBoundingClientRect().height;
      sheetEl.style.transition = "none";
    };
    const move = (y) => {
      if (!dragging) return;
      const delta = startY - y; // 上方向のドラッグ量
      const newH = Math.min(maxH(), Math.max(startHeight, startHeight + delta));
      sheetEl.style.maxHeight = newH + "px";
      if (sheetEl.id === "settingsSheet") sheetEl.style.height = newH + "px";
    };
    const end = () => {
      dragging = false;
      sheetEl.style.transition = "";
    };
    handleEl.addEventListener("touchstart", (e) => start(e.touches[0].clientY), { passive: true });
    handleEl.addEventListener("touchmove", (e) => move(e.touches[0].clientY), { passive: true });
    handleEl.addEventListener("touchend", end);
    handleEl.addEventListener("mousedown", (e) => {
      start(e.clientY);
      const onMove = (ev) => move(ev.clientY);
      const onUp = () => { end(); document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  };

  // ---------- 下から出る操作シート(汎用) ----------
  function closeActionSheet() {
    const el = document.getElementById("msgActionOverlay");
    if (!el || el.classList.contains("closing")) return;
    el.classList.add("closing");
    setTimeout(() => el.remove(), 180);
  }
  function openActionSheet(buildFn) {
    const existing = document.getElementById("msgActionOverlay");
    if (existing) existing.remove(); // 連続で開かれた場合は、古いものを即座に差し替える
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "msgActionOverlay";
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    const handle = document.createElement("div");
    handle.className = "sheet-handle";
    sheet.appendChild(handle);
    buildFn(sheet);
    overlay.appendChild(sheet);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeActionSheet(); });
    document.body.appendChild(overlay);
    window.makeSheetDraggable(sheet, handle);
  }
  function sheetActionButton(label, danger, fn) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sheet-action" + (danger ? " danger" : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  // メッセージ長押し → 絵文字クイック選択 + 編集/返信/コピー
  function openMessageActionSheet(id) {
    const ref = messageEls.get(id);
    if (!ref) return;
    openActionSheet((sheet) => {
      const emojiRow = document.createElement("div");
      emojiRow.className = "quick-emoji-row";
      EMOJI_SET.forEach((em) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = em;
        b.addEventListener("click", () => {
          socket.emit("toggle_reaction", { id, emoji: em });
          closeActionSheet();
        });
        emojiRow.appendChild(b);
      });
      sheet.appendChild(emojiRow);

      if (ref.mine) {
        sheet.appendChild(sheetActionButton("✏️ メッセージを編集", false, () => {
          closeActionSheet();
          startEditMessage(id);
        }));
      }
      sheet.appendChild(sheetActionButton("↩️ 返信", false, () => {
        closeActionSheet();
        setReplyTarget(id, ref.isGroup);
      }));
      sheet.appendChild(sheetActionButton("📋 テキストをコピー", false, () => {
        closeActionSheet();
        copyText(ref.text);
      }));

      if (!ref.mine) {
        const divider = document.createElement("div");
        divider.style.height = "10px";
        sheet.appendChild(divider);
        sheet.appendChild(sheetActionButton("🚩 通報", true, () => {
          closeActionSheet();
          const ok = confirm("この発言を通報しますか?\n送信者は自動的にブロックされ、今後ランダムチャットでマッチングしなくなります。");
          if (!ok) return;
          socket.emit("report_message", { id });
          alert("通報しました。ご協力ありがとうございます。");
        }));
      }
    });
  }

  // 長押し(スマホ)・マウス長押し(PC)・右クリックで操作シートを開く
  function bindLongPress(row, id) {
    let timer = null;
    let moved = false;
    const start = () => { moved = false; timer = setTimeout(() => openMessageActionSheet(id), 420); };
    const cancel = () => { if (timer) clearTimeout(timer); timer = null; };
    row.addEventListener("touchstart", start, { passive: true });
    row.addEventListener("touchend", cancel);
    row.addEventListener("touchmove", () => { moved = true; cancel(); });
    row.addEventListener("mousedown", start);
    row.addEventListener("mouseup", cancel);
    row.addEventListener("mouseleave", cancel);
    row.addEventListener("contextmenu", (e) => { e.preventDefault(); openMessageActionSheet(id); });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }

  // ---------- 編集 ----------
  function startEditMessage(id) {
    const ref = messageEls.get(id);
    if (!ref || !ref.mine) return;
    ref.textEl.innerHTML = "";
    const box = document.createElement("div");
    box.className = "edit-box";
    const textarea = document.createElement("textarea");
    textarea.value = ref.text;
    const actions = document.createElement("div");
    actions.className = "edit-actions";
    const saveBtn = document.createElement("button");
    saveBtn.type = "button"; saveBtn.textContent = "保存";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button"; cancelBtn.className = "secondary"; cancelBtn.textContent = "キャンセル";
    saveBtn.addEventListener("click", () => {
      const v = textarea.value.trim();
      if (!v) return;
      socket.emit("edit_message", { id, text: v });
    });
    cancelBtn.addEventListener("click", () => renderMessageText(ref));
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    box.appendChild(textarea);
    box.appendChild(actions);
    ref.textEl.appendChild(box);
    textarea.focus();
  }

  function renderMessageText(ref) {
    ref.textEl.innerHTML = "";

    let mentionsMe = false;
    if (ref.isGroup) {
      const span = document.createElement("span");
      mentionsMe = renderTextWithMentions(span, ref.text);
      ref.textEl.appendChild(span);
    } else {
      ref.textEl.appendChild(document.createTextNode(ref.text));
    }

    if (ref.edited) {
      const tag = document.createElement("span");
      tag.className = "edited-tag";
      tag.textContent = "(編集済み)";
      ref.textEl.appendChild(tag);
    }

    ref.row.classList.toggle("mention-me", mentionsMe);
    if (!ref.mine) applyPartnerColors();
  }

  socket.on("message_edited", ({ id, text }) => {
    const ref = messageEls.get(id);
    if (!ref) return;
    ref.text = text;
    ref.edited = true;
    renderMessageText(ref);
  });

  // ---------- 返信 ----------
  let replyTarget = null; // 個人/ランダム用
  let groupReplyTarget = null; // グループ用
  let groupReplyMentionOn = true; // 返信と同時に @メンションも付けるか(グループのみ)
  const replyPreview = document.getElementById("replyPreview");
  const replyPreviewText = document.getElementById("replyPreviewText");
  const groupReplyPreview = document.getElementById("groupReplyPreview");
  const groupReplyPreviewText = document.getElementById("groupReplyPreviewText");
  const groupReplyMentionToggle = document.getElementById("groupReplyMentionToggle");

  // 返信中、対象メッセージ本体を青く光らせて「どれに返信しているか」を分かりやすくする
  let highlightedReplyRowEl = null;
  function clearReplyHighlight() {
    if (highlightedReplyRowEl) {
      highlightedReplyRowEl.classList.remove("reply-target-highlight");
      highlightedReplyRowEl = null;
    }
  }

  function setReplyTarget(id, isGroup) {
    const ref = messageEls.get(id);
    if (!ref) return;
    clearReplyHighlight();
    ref.row.classList.add("reply-target-highlight");
    highlightedReplyRowEl = ref.row;
    const who = ref.mine ? "自分" : ref.name;
    const snippet = ref.text.length > 40 ? ref.text.slice(0, 40) + "…" : ref.text;
    const target = { id, name: who, text: snippet, verified: ref.mine ? isMyAccountVerified() : ref.verified };
    if (isGroup) {
      groupReplyTarget = target;
      groupReplyPreviewText.textContent = who;
      groupReplyMentionOn = true;
      groupReplyMentionToggle.classList.add("on");
      groupReplyMentionToggle.textContent = "@ ON";
      groupReplyMentionToggle.classList.toggle("hidden", ref.mine); // 自分への返信にメンションは不要
      groupReplyPreview.classList.remove("hidden");
      groupMsgInput.focus();
    } else {
      replyTarget = target;
      replyPreviewText.textContent = who;
      replyPreview.classList.remove("hidden");
      msgInput.focus();
    }
  }
  document.getElementById("replyPreviewCancel").addEventListener("click", () => {
    replyTarget = null;
    replyPreview.classList.add("hidden");
    clearReplyHighlight();
  });
  document.getElementById("groupReplyPreviewCancel").addEventListener("click", () => {
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
    clearReplyHighlight();
  });
  groupReplyMentionToggle.addEventListener("click", () => {
    groupReplyMentionOn = !groupReplyMentionOn;
    groupReplyMentionToggle.classList.toggle("on", groupReplyMentionOn);
    groupReplyMentionToggle.textContent = groupReplyMentionOn ? "@ ON" : "@ OFF";
  });

  // 返信の引用: 小さいアイコン+名前+抜粋を横1行にまとめ、少し右にずらして本文の上に差し込む
  function buildReplyQuote(replyTo, isGroup, body) {
    const origRef = messageEls.get(replyTo.id);
    const letter = (replyTo.name || "?").trim().slice(0, 1).toUpperCase();
    let avatarUrl = null;
    if (origRef) {
      avatarUrl = origRef.mine ? getMyAvatar() : (isGroup ? groupAvatars.get(origRef.from) : partnerAvatar);
    }
    const miniAvatar = document.createElement("span");
    miniAvatar.className = "rq-avatar";
    setAvatarEl(miniAvatar, avatarUrl, letter);

    const line = document.createElement("div");
    line.className = "reply-quote-line";
    const nameEl = document.createElement("span");
    nameEl.className = "rq-name";
    nameEl.textContent = replyTo.name;
    if (replyTo.verified) nameEl.appendChild(makeVerifiedBadge());
    const textEl = document.createElement("span");
    textEl.className = "rq-text";
    textEl.textContent = replyTo.text;
    line.appendChild(miniAvatar);
    line.appendChild(nameEl);
    line.appendChild(textEl);
    line.addEventListener("click", (e) => {
      e.stopPropagation();
      const target = messageEls.get(replyTo.id);
      if (target) target.row.scrollIntoView({ block: "center", behavior: "smooth" });
    });
    body.insertBefore(line, body.firstChild);
    return miniAvatar;
  }

  // Discordのように、引用の小さいアイコンと本来のアイコンを曲線でつなぐ。
  // チャット履歴は画面がまだ非表示(display:none)のうちに描画されることがあり、
  // そのままだと getBoundingClientRect が全部0になって線が壊れるため、
  // CSSで固定しているサイズから座標を直接計算する(表示状態に左右されない)。
  function drawReplyConnector(row) {
    const AVATAR_LEFT = 4, AVATAR_TOP = 7, AVATAR_SIZE = 34; // row padding + .avatar-circle
    const MINI_LEFT = 58, MINI_TOP = 6, MINI_SIZE = 16; // row padding + avatarCol + gap + .reply-quote-line margin
    const ax = AVATAR_LEFT + AVATAR_SIZE / 2;
    const ay = AVATAR_TOP;
    const mx = MINI_LEFT;
    const my = MINI_TOP + MINI_SIZE / 2;
    const midY = (my + ay) / 2;

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "rq-connector-svg");
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", `M ${mx} ${my} C ${mx - 12} ${my}, ${ax} ${midY}, ${ax} ${ay}`);
    path.setAttribute("style", "fill:none; stroke:var(--rq-line-color); stroke-width:1.5; stroke-linecap:round;");
    svg.appendChild(path);
    row.appendChild(svg);
  }

  // ---------- リアクション(押すと「誰が押したか」が見られる) ----------
  function renderReactions(id, reactions) {
    const ref = messageEls.get(id);
    if (!ref) return;
    ref.reactionRow.innerHTML = "";
    reactions.forEach(({ emoji, socketIds }) => {
      if (!socketIds.length) return;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "reaction-pill" + (socketIds.includes(socket.id) ? " mine" : "");
      b.textContent = emoji + " " + socketIds.length;
      b.addEventListener("click", () => openReactorSheet(id, emoji, socketIds, ref.isGroup));
      ref.reactionRow.appendChild(b);
    });
  }
  socket.on("reaction_update", ({ id, reactions }) => renderReactions(id, reactions));

  function openReactorSheet(id, emoji, socketIds, isGroup) {
    openActionSheet((sheet) => {
      const title = document.createElement("div");
      title.className = "sheet-title";
      title.textContent = emoji;
      sheet.appendChild(title);
      socketIds.forEach((sid) => {
        const row = document.createElement("div");
        row.className = "reactor-row";
        row.appendChild(document.createTextNode(resolveName(sid, isGroup)));
        if (resolveVerified(sid, isGroup)) row.appendChild(makeVerifiedBadge());
        sheet.appendChild(row);
      });
      const mine = socketIds.includes(socket.id);
      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "secondary";
      toggleBtn.style.marginTop = "12px";
      toggleBtn.textContent = mine ? "自分のリアクションを取り消す" : "自分もこの絵文字でリアクションする";
      toggleBtn.addEventListener("click", () => {
        socket.emit("toggle_reaction", { id, emoji });
        closeActionSheet();
      });
      sheet.appendChild(toggleBtn);
    });
  }

  function renderReadReceipt(id, count) {
    const ref = messageEls.get(id);
    if (!ref || !ref.mine) return;
    ref.readEl.textContent = count > 0 ? (count > 1 ? `既読 ${count}` : "既読") : "";
  }
  socket.on("read_update", ({ id, count }) => renderReadReceipt(id, count));

  // 相手からのメッセージが画面に表示され、かつタブがアクティブなら既読を送る
  function maybeMarkRead(id, mine) {
    if (mine || document.hidden) return;
    socket.emit("read_message", { id });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    // 画面復帰時、表示中の未既読メッセージをまとめて既読にする
    messageEls.forEach((ref, id) => { if (!ref.mine) socket.emit("read_message", { id }); });
  });

  // 認証済み(Googleサインイン)バッジ。本物のユーザー確認ではなく、あくまで目印。
  function makeVerifiedBadge() {
    const b = document.createElement("span");
    b.className = "verified-badge";
    b.textContent = "✓";
    b.title = "認証済み(Googleアカウント)";
    return b;
  }

  function renderMessage(targetBox, { id, from, name, text, nameColor, textColor, replyTo, verified, ts }) {
    const mine = from === socket.id;
    const isGroup = targetBox === groupChatBox;

    const row = document.createElement("div");
    row.className = "msg-flat " + (mine ? "mine" : "them");
    row.dataset.id = id;
    if (!mine && HEX_RE.test(nameColor || "")) row.dataset.nameColor = nameColor;
    if (!mine && HEX_RE.test(textColor || "")) row.dataset.textColor = textColor;

    const avatarCol = document.createElement("div");
    avatarCol.className = "msg-avatar-col";
    const avatar = document.createElement("span");
    avatar.className = "avatar-circle";
    const letter = (name || "?").trim().slice(0, 1).toUpperCase();
    const avatarUrl = mine ? getMyAvatar() : (isGroup ? groupAvatars.get(from) : partnerAvatar);
    setAvatarEl(avatar, avatarUrl, letter);

    const body = document.createElement("div");
    body.className = "msg-body";

    const head = document.createElement("div");
    head.className = "msg-head";
    const nameEl = document.createElement("span");
    nameEl.className = "msg-name";
    nameEl.textContent = mine ? "自分" : name;
    head.appendChild(nameEl);
    if (verified) head.appendChild(makeVerifiedBadge());
    const timeEl = document.createElement("span");
    timeEl.className = "msg-time";
    timeEl.textContent = formatTime(ts);
    head.appendChild(timeEl);

    const textEl = document.createElement("div");
    textEl.className = "msg-text";

    const reactionRow = document.createElement("div");
    reactionRow.className = "reaction-row";

    const readEl = document.createElement("div");
    readEl.className = "read-receipt";

    body.appendChild(head);
    body.appendChild(textEl);
    body.appendChild(reactionRow);
    if (mine) body.appendChild(readEl);

    // 返信の引用: 小さいアイコン+名前+抜粋を本文の上に、本来のアイコンとは線でつなぐ
    if (replyTo) {
      buildReplyQuote(replyTo, isGroup, body);
      drawReplyConnector(row);
    }
    avatarCol.appendChild(avatar);

    row.appendChild(avatarCol);
    row.appendChild(body);

    targetBox.appendChild(row);
    const ref = { row, body, head, textEl, reactionRow, readEl, mine, isGroup, name, from, text, verified: !!verified, replyTo: replyTo || null, edited: false, targetBox };
    messageEls.set(id, ref);
    renderMessageText(ref);
    bindLongPress(row, id);
    targetBox.scrollTop = targetBox.scrollHeight;

    maybeMarkRead(id, mine);
  }

  socket.on("chat_message", (data) => {
    const targetBox = currentMode === "group" ? groupChatBox : chatBox;
    renderMessage(targetBox, data);
  });

  // 入室直後に届く、直近1日分の履歴をまとめて描画する
  socket.on("chat_history", ({ messages }) => {
    if (!Array.isArray(messages) || !messages.length) return;
    // オープンチャットは、group_update が届く前にこのイベントが先着するため
    // currentMode がまだ "open" のままのことがある → group と同じ箱に出す
    const targetBox = (currentMode === "group" || currentMode === "open") ? groupChatBox : chatBox;
    messages.forEach((m) => {
      renderMessage(targetBox, m);
      if (m.reactions && m.reactions.length) renderReactions(m.id, m.reactions);
      if (m.edited) {
        const ref = messageEls.get(m.id);
        if (ref) { ref.edited = true; renderMessageText(ref); }
      }
    });
    if (messages.length) addSystemMessage(targetBox, "— ここより上は直近1日の履歴 —");
  });

  // ---------- 入力中インジケーター ----------
  function makeTypingTracker(indicatorEl, textEl) {
    const timers = new Map();
    function refresh() {
      const names = [...timers.keys()];
      if (!names.length) { indicatorEl.classList.add("hidden"); return; }
      textEl.textContent = names.join("、") + " が入力中…";
      indicatorEl.classList.remove("hidden");
    }
    return {
      add(name) {
        if (timers.has(name)) clearTimeout(timers.get(name));
        timers.set(name, setTimeout(() => { timers.delete(name); refresh(); }, 3000));
        refresh();
      },
      clear() {
        timers.forEach((t) => clearTimeout(t));
        timers.clear();
        indicatorEl.classList.add("hidden");
      },
    };
  }
  const personalTyping = makeTypingTracker(document.getElementById("typingIndicator"), document.getElementById("typingText"));
  const groupTyping = makeTypingTracker(document.getElementById("groupTypingIndicator"), document.getElementById("groupTypingText"));

  socket.on("typing", ({ name }) => {
    (currentMode === "group" ? groupTyping : personalTyping).add(name);
  });

  let lastTypingEmit = 0;
  function emitTyping() {
    const now = Date.now();
    if (now - lastTypingEmit < 1500) return;
    lastTypingEmit = now;
    socket.emit("typing");
  }
  msgInput.addEventListener("input", emitTyping);

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    const payload = { text, ...getMyColors() };
    if (replyTarget) payload.replyTo = replyTarget;
    socket.emit("send_message", payload);
    msgInput.value = "";
    replyTarget = null;
    replyPreview.classList.add("hidden");
    clearReplyHighlight();
    lastTypingEmit = 0;
  }
  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  // ---------- メンション候補(@入力時に一致する参加者名を表示) ----------
  const mentionList = document.getElementById("mentionList");

  function hideMentionList() {
    mentionList.classList.add("hidden");
    mentionList.innerHTML = "";
  }

  function updateMentionSuggestions() {
    const val = groupMsgInput.value;
    const caret = groupMsgInput.selectionStart;
    const uptoCaret = val.slice(0, caret);
    const atIndex = uptoCaret.lastIndexOf("@");
    if (atIndex === -1 || /\s/.test(uptoCaret.slice(atIndex + 1))) { hideMentionList(); return; }

    const partial = uptoCaret.slice(atIndex + 1).toLowerCase();
    const candidates = groupMemberNames.filter((n) => n.toLowerCase().includes(partial)).slice(0, 5);
    if (candidates.length === 0) { hideMentionList(); return; }

    mentionList.innerHTML = "";
    candidates.forEach((n) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "@" + n;
      // mousedown で処理する(click だと先に input の blur が走ってしまうため)
      b.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const before = val.slice(0, atIndex);
        const after = val.slice(caret);
        groupMsgInput.value = before + "@" + n + " " + after;
        hideMentionList();
        groupMsgInput.focus();
      });
      mentionList.appendChild(b);
    });
    mentionList.classList.remove("hidden");
  }

  groupMsgInput.addEventListener("input", updateMentionSuggestions);
  groupMsgInput.addEventListener("input", emitTyping);
  groupMsgInput.addEventListener("blur", () => { setTimeout(hideMentionList, 150); });

  function sendGroupMessage() {
    let text = groupMsgInput.value.trim();
    if (!text) return;
    // 返信中で「@ON」なら、相手の名前を自動でメンションとして本文に付ける
    if (groupReplyTarget && groupReplyMentionOn && groupReplyTarget.name !== "自分") {
      const prefix = "@" + groupReplyTarget.name + " ";
      if (!text.startsWith(prefix)) text = prefix + text;
    }
    const payload = { text, ...getMyColors() };
    if (groupReplyTarget) payload.replyTo = groupReplyTarget;
    socket.emit("send_message", payload);
    groupMsgInput.value = "";
    groupReplyTarget = null;
    groupReplyPreview.classList.add("hidden");
    clearReplyHighlight();
    hideMentionList();
    lastTypingEmit = 0;
  }
  groupSendBtn.addEventListener("click", sendGroupMessage);
  groupMsgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendGroupMessage(); });
</script>
<script src="/settings.js"></script>
<script>
// 自分のユーザー名の色・文字色を変更する(設定 > テーマ)
(() => {
  const root = document.documentElement;
  const load = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const save = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
  const toHex = (rgb) =>
    '#' + rgb.match(/\d+/g).slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('');

  // 現在のテーマでの標準色(ピッカーの初期表示用)
  function probe() {
    const el = document.createElement('div');
    el.className = 'msg-flat mine';
    el.style.cssText = 'position:absolute; visibility:hidden;';
    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name';
    el.appendChild(nameEl);
    document.body.appendChild(el);
    const c = getComputedStyle(nameEl).color;
    el.remove();
    return toHex(c);
  }

  function setupColor({ key, attr, cssVar, inputId, resetId }) {
    const input = document.getElementById(inputId);
    const resetBtn = document.getElementById(resetId);
    const sync = () => { input.value = probe(); };
    const apply = (c) => { root.style.setProperty(cssVar, c); root.setAttribute(attr, ''); };

    const saved = load(key);
    if (saved) { apply(saved); input.value = saved; } else { sync(); }

    input.addEventListener('input', (e) => { apply(e.target.value); save(key, e.target.value); });

    resetBtn.addEventListener('click', () => {
      root.style.removeProperty(cssVar);
      root.removeAttribute(attr);
      save(key, null);
      sync();
    });

    // テーマ切り替え時、未カスタムならピッカー表示を標準色に追従させる
    new MutationObserver(() => { if (!load(key)) sync(); })
      .observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  }

  setupColor({ key: 'myNameColor', attr: 'data-custom-name', cssVar: '--my-name-color',
               inputId: 'myNameColor', resetId: 'myNameReset' });
  setupColor({ key: 'myMsgColor', attr: 'data-custom-me', cssVar: '--my-msg-color',
               inputId: 'myMsgColor', resetId: 'myMsgReset' });

  // 相手のカラー変更をブロック(切り替えると表示中のメッセージにもすぐ反映)
  const blockEl = document.getElementById('blockPartnerColor');
  blockEl.checked = load('blockPartnerColor') === '1';
  blockEl.addEventListener('change', () => {
    save('blockPartnerColor', blockEl.checked ? '1' : null);
    applyPartnerColors();
  });
})();
</script>
